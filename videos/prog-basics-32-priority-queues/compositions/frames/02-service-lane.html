<template>
  <style>
    @font-face{font-family:"Space Grotesk";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/SpaceGrotesk-400.woff2") format("woff2");}
    @font-face{font-family:"Space Grotesk";font-weight:700;font-style:normal;font-display:block;src:url("assets/fonts/SpaceGrotesk-700.woff2") format("woff2");}
    @font-face{font-family:"JetBrains Mono";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/JetBrainsMono-400.woff2") format("woff2");}
    @font-face{font-family:"JetBrains Mono";font-weight:700;font-style:normal;font-display:block;src:url("assets/fonts/JetBrainsMono-700.woff2") format("woff2");}

    /* ligature kill-list on every frame (frame.md v3.0 § 2) */
    #root { position: absolute; inset: 0; container-type: size; overflow: hidden;
      font-family: "Space Grotesk", sans-serif; color: #F4F1EA;
      font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0, "dlig" 0; }
    .clipband { position: absolute; inset: 0; }

    .gnd-fill { position: absolute; inset: 0; background: #15181D; }
    .gnd-grid { position: absolute; inset: -80px;
      background: radial-gradient(circle, rgba(244,241,234,0.055) 2px, transparent 2px) 0 0 / 56px 56px; }
    .gnd-glow-a { position: absolute; left: -150px; top: 210px; width: 780px; height: 780px;
      border-radius: 9999px; filter: blur(46px);
      background: radial-gradient(closest-side, rgba(255,209,102,0.16), transparent 72%); }
    .gnd-glow-b { position: absolute; left: 620px; top: 600px; width: 660px; height: 660px;
      border-radius: 9999px; filter: blur(46px);
      background: radial-gradient(closest-side, rgba(90,214,160,0.13), transparent 72%); }
    .gnd-shelf { position: absolute; left: 60px; top: 1010px; width: 960px; height: 1px;
      background: rgba(255,255,255,0.08); }

    .pb-kicker { position: absolute; left: 72px; top: 230px; width: 936px; height: 44px;
      display: flex; align-items: center; white-space: nowrap; }
    .pb-ktext { display: inline-block; opacity: 0; font-family: "JetBrains Mono", monospace;
      font-size: 1.55cqw; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase;
      color: #9BA6B2; }

    /* ── G15 service lane (frame.md v3.0 § 6) — the heap is § 6's G11 geometry ── */
    .g15-node { position: absolute; box-sizing: border-box; background: #1F242C;
      border: 3px solid rgba(255,255,255,0.16); border-radius: 22px; opacity: 0;
      box-shadow: 0 18px 40px -18px rgba(0,0,0,0.70);
      display: flex; align-items: center; justify-content: center; padding-top: 38px; }
    .g15-val { display: inline-block; font-family: "JetBrains Mono", monospace; font-weight: 700;
      font-size: 4.2cqw; line-height: 1; color: #5AD6A0; }
    /* G11's name tab: h 38, --panel-2, 3px --line under-edge, radius 18/18/0/0, on the node's
       top-left edge. 2.2cqw so an 8-char label fits inside a 148px node (BRIEF deviation 5). */
    .g15-tab { position: absolute; left: 0; top: 0; width: 100%; height: 38px; box-sizing: border-box;
      background: #262C36; border-bottom: 3px solid rgba(255,255,255,0.16);
      border-radius: 18px 18px 0 0; display: flex; align-items: center; justify-content: center;
      padding: 0 10px; opacity: 0;
      font-family: "JetBrains Mono", monospace; font-size: 2.2cqw; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; color: #F4F1EA; white-space: nowrap; }
    .g15-tab.dim { color: #9BA6B2; }
    /* countable connectors: 3px --line CSS divs, never SVG in a scaled container */
    .g15-vbar { position: absolute; width: 3px; box-sizing: border-box; opacity: 0;
      background: rgba(255,255,255,0.16); border-radius: 2px; transform-origin: top center;
      transform: scaleY(0); }
    .g15-hbar { position: absolute; height: 3px; box-sizing: border-box; opacity: 0;
      background: rgba(255,255,255,0.16); border-radius: 2px; transform-origin: left center;
      transform: scaleX(0); }
    .g15-chev { position: absolute; width: 11px; height: 11px; box-sizing: border-box; opacity: 0;
      border-top: 3px solid rgba(255,255,255,0.16); border-right: 3px solid rgba(255,255,255,0.16);
      transform: rotate(45deg); }
    /* the served slot (G15: 200x84 --panel-2 at left 736 / y 300, tab SERVED mono --muted) */
    .g15-slot { position: absolute; box-sizing: border-box; background: #262C36;
      border: 3px solid rgba(255,255,255,0.16); border-radius: 22px; opacity: 0;
      box-shadow: 0 18px 40px -18px rgba(0,0,0,0.70); }
    /* the ring is the node the voice is on (G11 colour law): --say, +10px bleed on every side */
    .g15-ring { position: absolute; box-sizing: border-box; border: 3px solid #FFD166;
      border-radius: 9999px; opacity: 0; box-shadow: 0 0 0 8px rgba(255,209,102,0.12); }
    /* name chips: --panel-2, mono --muted, no output, no number, no colour role (§ 4d) */
    .g15-chip { position: absolute; box-sizing: border-box; background: #262C36;
      border: 2px solid rgba(255,255,255,0.16); border-radius: 12px; opacity: 0; display: flex;
      align-items: center; justify-content: center; padding: 0 16px;
      font-family: "JetBrains Mono", monospace; font-size: 1.85cqw; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase; color: #9BA6B2; white-space: nowrap; }
    /* G2's empty state: 3px dashed --line, no value, one dim mint caret blinking at 1s */
    .g15-wait { position: absolute; box-sizing: border-box; background: transparent;
      border: 3px dashed rgba(255,255,255,0.16); border-radius: 12px; opacity: 0; }
    .g15-caret { position: absolute; left: 20px; top: 16px; width: 4px; height: 32px;
      border-radius: 2px; background: rgba(90,214,160,0.55); opacity: 0; }
  </style>

  <div id="root" data-composition-id="02-service-lane" data-width="1080" data-height="1920" data-duration="11">

    <div id="g2-ground" class="clip clipband" data-start="0" data-duration="11" data-track-index="0">
      <div class="gnd-fill"></div>
      <div id="g2-grid" class="gnd-grid"></div>
      <div id="g2-ga" class="gnd-glow-a"></div>
      <div id="g2-gb" class="gnd-glow-b"></div>
      <div class="gnd-shelf"></div>
    </div>

    <div id="c2-chrome" class="clip clipband" data-start="0" data-duration="11" data-track-index="1">
      <div class="pb-kicker">
        <div id="c2-ktext" class="pb-ktext" data-layout-ignore>PROGRAMMING BASICS · BASICS III · 32</div>
      </div>
    </div>

    <div id="f2-content" class="clip clipband" data-start="0" data-duration="11" data-track-index="2">

      <!-- the lane the items wait in: two empty intake chambers at exactly the coordinates the
           tuple chips take on F3 (left 72 / y 640 and y 712, 280x64). "The oldest item waits its
           turn" is drawn as stillness and an empty box, not as motion. -->
      <div id="f2-w0" class="g15-wait" style="left:72px; top:640px; width:280px; height:64px;"></div>
      <div id="f2-wc0" class="g15-caret" style="left:92px; top:656px;"></div>
      <div id="f2-w1" class="g15-wait" style="left:72px; top:712px; width:280px; height:64px;"></div>
      <div id="f2-wc1" class="g15-caret" style="left:92px; top:728px;"></div>

      <!-- 29's heap, top two levels: root centred at 540 on y 292, L1 at lefts 232 / 700 on y 452.
           Values are 29's executed heappush order [1, 3, 2, 7, 5], levels 0-1 (bible § 4). -->
      <div id="f2-elbowA" class="g15-vbar" style="left:538px; top:386px; height:34px;"></div>
      <div id="f2-runA" class="g15-hbar" style="left:304px; top:418px; width:236px;"></div>
      <div id="f2-runB" class="g15-hbar" style="left:538px; top:418px; width:236px;"></div>
      <div id="f2-upA" class="g15-vbar" style="left:304px; top:418px; height:36px;"></div>
      <div id="f2-upB" class="g15-vbar" style="left:772px; top:418px; height:36px;"></div>

      <div id="f2-root" class="g15-node" style="left:466px; top:292px; width:148px; height:96px;">
        <span id="f2-v0" class="g15-val">1</span>
      </div>
      <div id="f2-tab0" class="g15-tab" style="left:466px; top:292px; width:148px;" data-layout-ignore>priority</div>

      <div id="f2-c1" class="g15-node" style="left:232px; top:452px; width:148px; height:96px;">
        <span id="f2-v1" class="g15-val">3</span>
      </div>
      <div id="f2-c2" class="g15-node" style="left:700px; top:452px; width:148px; height:96px;">
        <span id="f2-v2" class="g15-val">2</span>
      </div>

      <div id="f2-ring" class="g15-ring" style="left:456px; top:282px; width:168px; height:116px;"></div>

      <!-- the HEAP chip: part 29's own word, arriving on "built on a heap" -->
      <div id="f2-heap" class="g15-chip" style="left:424px; top:572px; width:232px; height:56px;" data-layout-ignore>heap</div>

      <!-- the serving order: the slot, then the rail that joins them. 200x84 at left 736 / y 300. -->
      <div id="f2-slot" class="g15-slot" style="left:736px; top:300px; width:200px; height:84px;"></div>
      <div id="f2-tab1" class="g15-tab dim" style="left:736px; top:300px; width:200px;" data-layout-ignore>queue</div>
      <div id="f2-rail" class="g15-hbar" style="left:614px; top:338px; width:122px;"></div>
      <div id="f2-railchev" class="g15-chev" style="left:722px; top:334px;"></div>
    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var D = 11;
      var el = function (id) { return document.getElementById(id); };
      var tl = gsap.timeline({ paused: true });
      window.__timelines["02-service-lane"] = tl;

      /* ground returns to its own zero: 4 passes of D/4 = 11 */
      tl.fromTo(el("g2-grid"), { y: 0 }, { y: 16, duration: 2.75, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
      tl.fromTo(el("g2-ga"), { opacity: 0.55 }, { opacity: 1, duration: 2.75, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
      tl.fromTo(el("g2-gb"), { opacity: 0.5 }, { opacity: 1, duration: 2.75, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);

      tl.fromTo(el("c2-ktext"), { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 0.1);

      /* entrance wipe: this frame comes in from the right */
      tl.fromTo(el("f2-content"), { x: 140, opacity: 0 }, { x: 0, opacity: 1, duration: 0.42, ease: "power3.out" }, 0.12);

      /* ── S1 "A priority queue serves the highest priority first" ──
         P2 drop-in, PARENT BEFORE CHILD, on the MEASURED onsets (studio cues): queue 0.56 /
         serves 0.90 / highest 1.60 / priority 1.94 / first 2.54; each elbow's bars drawn
         stub -> run -> stub (P8, 0.14s each) */
      tl.fromTo(el("f2-root"), { y: -210, opacity: 0 }, { y: 0, opacity: 1, duration: 0.46, ease: "bounce.out", immediateRender: false }, 0.5);
      tl.fromTo(el("f2-root"), { scaleY: 0.96 }, { scaleY: 1, duration: 0.18, ease: "power2.out", immediateRender: false }, 0.97);
      tl.fromTo(el("f2-c1"), { y: -210, opacity: 0 }, { y: 0, opacity: 1, duration: 0.46, ease: "bounce.out", immediateRender: false }, 1.55);
      tl.fromTo(el("f2-c2"), { y: -210, opacity: 0 }, { y: 0, opacity: 1, duration: 0.46, ease: "bounce.out", immediateRender: false }, 1.95);

      tl.fromTo(el("f2-elbowA"), { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.14, ease: "power3.out", immediateRender: false }, 2.45);
      tl.fromTo(el("f2-runA"), { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.14, ease: "power3.out", immediateRender: false }, 2.6);
      tl.fromTo(el("f2-runB"), { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.14, ease: "power3.out", immediateRender: false }, 2.6);
      tl.fromTo(el("f2-upA"), { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.14, ease: "power3.out", immediateRender: false }, 2.75);
      tl.fromTo(el("f2-upB"), { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.14, ease: "power3.out", immediateRender: false }, 2.75);

      /* the one amber arrival of this beat: the --say ring on the node the voice is on
         (G11 colour law), landing on "priority" 1.94 and retiring before anything dims (§ 1). */
      tl.fromTo(el("f2-ring"), { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.26, ease: "back.out(1.6)", immediateRender: false }, 1.95);
      tl.to(el("f2-ring"), { opacity: 0, duration: 0.28, ease: "power2.in" }, 2.9);

      /* "PRIORITY" lands on the root's name tab on the word itself */
      tl.fromTo(el("f2-tab0"), { opacity: 0, y: -18, scaleY: 0.8 }, { opacity: 1, y: 0, scaleY: 1, duration: 0.26, ease: "power3.out", immediateRender: false }, 1.96);

      /* ── S2 "The oldest item waits its turn" — stillness: two empty intake chambers
         (oldest 3.72 / item 4.02 / waits 4.46 / turn 4.98), nothing in the tree moves, the caret
         blinks at 1s (G2's empty state) ── */
      tl.fromTo(el("f2-w0"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.32, ease: "power3.out", immediateRender: false }, 3.7);
      tl.fromTo(el("f2-w1"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.32, ease: "power3.out", immediateRender: false }, 3.98);
      tl.fromTo(el("f2-wc0"), { opacity: 0 }, { opacity: 0.9, duration: 0.5, ease: "steps(1)", immediateRender: false }, 4.44);
      tl.fromTo(el("f2-wc1"), { opacity: 0 }, { opacity: 0.9, duration: 0.5, ease: "steps(1)", immediateRender: false }, 4.94);
      tl.to(el("f2-wc0"), { opacity: 0.12, duration: 0.5, ease: "steps(1)", repeat: 5, yoyo: true, immediateRender: false }, 4.94);
      tl.to(el("f2-wc1"), { opacity: 0.12, duration: 0.5, ease: "steps(1)", repeat: 5, yoyo: true, immediateRender: false }, 5.44);

      /* ── S3 "It's usually built on a heap" — the HEAP chip (29's word) lands on "heap" 7.08 ── */
      tl.fromTo(el("f2-heap"), { opacity: 0, y: -24, scale: 0.94 },
        { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(1.5)", immediateRender: false }, 7.02);

      /* ── S4 "This is that heap, with a serving order" — that heap 8.38 / with 8.66 /
         serving 9.16 / order 9.46. The ring names the heap one more time (a separate beat), then
         the slot lands and the rail draws root -> slot (P8: bar, then chevron). ── */
      tl.fromTo(el("f2-ring"), { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.24, ease: "back.out(1.6)", immediateRender: false }, 8.36);
      tl.to(el("f2-ring"), { opacity: 0, duration: 0.26, ease: "power2.in" }, 8.92);
      tl.fromTo(el("f2-slot"), { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.36, ease: "power3.out", immediateRender: false }, 8.6);
      tl.fromTo(el("f2-tab1"), { opacity: 0, y: -18, scaleY: 0.8 }, { opacity: 1, y: 0, scaleY: 1, duration: 0.26, ease: "power3.out", immediateRender: false }, 8.86);
      tl.fromTo(el("f2-rail"), { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.34, ease: "power3.out", immediateRender: false }, 9.16);
      tl.fromTo(el("f2-railchev"), { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, 9.48);

      /* ambient breath on the serving lane only, back to zero before the cut
         (9.6 + 2 x 0.7 = 11.0 = D exactly) */
      tl.fromTo(el("f2-slot"), { y: 0 }, { y: -5, duration: 0.7, ease: "sine.inOut", repeat: 1, yoyo: true, immediateRender: false }, 9.6);

      tl.to(el("f2-content"), { y: -60, opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.32);

      tl.to({}, { duration: D }, 0);
    })();
  </script>
</template>
