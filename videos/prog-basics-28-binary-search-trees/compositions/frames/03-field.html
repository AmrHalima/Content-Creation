      /* rows arrive top-down on the counter's clock: 0.28s apart (§ 6 motion contract), from 0.25

      var T0 = 0.25, STEP = 0.28;

      var host = el("f3-rows");
      for (var k = 0; k < 20; k++) {

      /* P9 count-tick over a time proxy — no TextPlugin, and the number lane is never tweened

        for (var i = 0; i < 20; i++) { if (clock.t >= step(i) + 0.14) { n = i + 1; } }
