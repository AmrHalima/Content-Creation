  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var D = 7.4;
      var el = function (id) { return document.getElementById(id); };
      var tl = gsap.timeline({ paused: true });
      window.__timelines["04-code"] = tl;

      tl.fromTo(el("g4-grid"), { y: 0 }, { y: 12, duration: D / 2, ease: "sine.inOut", repeat: 1, yoyo: true }, 0);
      tl.fromTo(el("g4-ga"), { opacity: 0.55 }, { opacity: 1, duration: D / 4, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
      tl.fromTo(el("g4-gb"), { opacity: 0.5 }, { opacity: 1, duration: D / 4, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
      tl.fromTo(el("c4-ktext"), { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 0.08);

      /* entrance wipe: F3 came in on x from the right, so F4 comes in on x from the left (§ 9) */
      tl.fromTo(el("f4-content"), { x: -140, opacity: 0 }, { x: 0, opacity: 1, duration: 0.42, ease: "power3.out" }, 0.1);
      tl.to(el("f4-content"), { x: 0, opacity: 1, duration: 0.01 }, 0.54);

      /* § 6's twenty executed values at their authored row tops, unchanged from F3 */
      var VALUES = ["1,000,000", "500,000", "250,000", "125,000", "62,500", "31,250", "15,625",
        "7,812", "3,906", "1,953", "976", "488", "244", "122", "61", "30", "15", "7", "3", "1"];
      var host = el("f4-rows");
      for (var k = 0; k < 20; k++) {
        var num = document.createElement("div");
        num.className = "f4-num" + (k >= 12 ? " dim" : "");
        num.id = "f4-n" + k;
        num.style.top = (250 + k * 36) + "px";
        num.textContent = VALUES[k];
        host.appendChild(num);
      }

      /* ── measured onsets (studio cues) ─────────────────────────────────────────
         Here 0.00 is 0.22 that 0.40 tree 0.60 as 0.88 code. 1.06-1.36
         It 1.86 looks 2.00 at 2.18 three 2.38 boxes 2.60-3.02 and 3.02 stops. 3.30-3.58
         That 4.24 is 4.48 what 4.70 twenty 4.86-5.16 means 5.16 for 5.48 a 5.72
         million. 5.82-6.06 */

      /* the field is already the board: it arrives as a set, no per-row accent, no colour */
      for (var i = 0; i < 20; i++) {
        tl.fromTo(el("f4-n" + i), { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.12 + i * 0.012);
      }
      tl.fromTo(el("f4-tag"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.28, ease: "power2.out", immediateRender: false }, 0.30);

      /* P3 type-on, one line per clause of "Here is that tree as code" */
      tl.fromTo(el("f4-chamber"), { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.38, ease: "power3.out", immediateRender: false }, 0.34);
      tl.fromTo(el("f4-file"), { opacity: 0 }, { opacity: 1, duration: 0.24, immediateRender: false }, 0.52);
      tl.fromTo(el("f4-lang"), { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.26, ease: "back.out(1.6)", immediateRender: false }, 0.62);
      function typeLine(n, at, dur, x) {
        tl.set(el("f4-l" + n), { opacity: 1 }, at);
        tl.fromTo(el("f4-m" + n), { scaleX: 1 }, { scaleX: 0, duration: dur, ease: "power1.inOut", immediateRender: false }, at);
        tl.fromTo(el("f4-cr" + n), { opacity: 1, x: 0 }, { opacity: 1, x: x, duration: dur, ease: "power1.inOut", immediateRender: false }, at);
        tl.set(el("f4-cr" + n), { opacity: 0 }, at + dur + 0.04);
      }
      typeLine(1, 0.72, 0.44, 470);
      typeLine(2, 1.20, 0.28, 300);
      typeLine(3, 1.52, 0.30, 320);
      typeLine(4, 1.86, 0.40, 400);

      /* "It looks at three boxes and stops." — stdout arrives on "It looks", the mint 3 on
         "three boxes", and the bracket chase reads t[0] / t[1][0] / t[1][1][0] */
      tl.fromTo(el("f4-term"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.32, ease: "power3.out", immediateRender: false }, 1.90);
      tl.fromTo(el("f4-termlab"), { opacity: 0 }, { opacity: 1, duration: 0.24, immediateRender: false }, 2.10);
      tl.fromTo(el("f4-out"), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.26, ease: "power2.out", immediateRender: false }, 2.38);
      tl.fromTo(el("f4-path"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 2.52);

      /* the one keyword sweep this frame owns (the piece: amber belongs to F1 and F4) — a bar
         under t[1][1], the two brackets that ARE the two lefts */
      tl.fromTo(el("f4-hopbar"), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, 2.80);
      tl.fromTo(el("f4-hoptag"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.26, ease: "power2.out", immediateRender: false }, 3.06);

      /* "That is what twenty means for a million." — the tick walks all twenty numbers and the
         counted tag stops being chrome on "twenty". Last dimmed row lights on "million." */
      tl.fromTo(el("f4-mark"), { opacity: 0 }, { opacity: 1, duration: 0.18, immediateRender: false }, 4.28);
      tl.to(el("f4-mark"), { y: 684, duration: 0.46, ease: "power2.inOut", immediateRender: false }, 4.60);
      tl.to(el("f4-mark"), { opacity: 0, duration: 0.22, ease: "power2.in", immediateRender: false }, 5.20);
      tl.to(el("f4-tag"), { color: "#F4F1EA", duration: 0.22, ease: "power1.out", immediateRender: false }, 4.86);
      tl.to(el("f4-n19"), { color: "#5AD6A0", duration: 0.26, ease: "power1.out", immediateRender: false }, 5.82);

      tl.to(el("f4-content"), { y: -60, opacity: 0, duration: 0.3, ease: "power2.in" }, 7.08);

      tl.to({}, { duration: D }, 0);
    })();
  </script>
