    (function () {
      window.__timelines = window.__timelines || {};

      // discrete-text-sequence via a time proxy + reverse search (no TextPlugin in this
      // setup — tl.set({text}) silently no-ops — and this stays deterministic under any
      // scrub direction). Identical helper to part 1's frame 5.
      function textSeq(node, states) {
        var pr = { t: 0 };
        tl.to(pr, {
          t: states[states.length - 1].t,
          duration: states[states.length - 1].t,
          ease: "none",
          onUpdate: function () {
            for (var i = states.length - 1; i >= 0; i--) {
              if (pr.t >= states[i].t) {
                if (node.textContent !== states[i].text) node.textContent = states[i].text;
                return;
              }
            }
          }
        }, 0);
      }

      // ── Scene 1 (0.0–1.8s) — "for years the web spoke HTTP": the pinned card seats at the
      //    upper third (hero axis 806) and is then immovable. The transport socket is still open. ──

      tl.fromTo(el("f3-card"), { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.48);
      tl.fromTo(el("f3-socket"), { opacity: 0 }, { opacity: 1, duration: 0.44, ease: "power1.out" }, 1.29);

      // HTTP's peer conversation is already running, and never changes in this frame

      a7.style.strokeDasharray = String(l7); a7.style.strokeDashoffset = String(l7);
      tl.to(a7, { strokeDashoffset: 0, duration: 0.6, ease: "power3.out" }, 2.26);
      tl.fromTo(el("f3-head7"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 2.74);
      tl.fromTo(el("f3-peer7"), { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 2.9);

      // ── Scene 2 (3.71–4.9s) — "over TCP": TCP slides into the socket (transform only, the
      //    socket's geometry is authored expanded — never a width/height tween), the chip resolves. ──

      var a4 = el("f3-arrow4"), l4 = a4.getTotalLength() * 1.05;
      a4.style.strokeDasharray = String(l4); a4.style.strokeDashoffset = String(l4);

      tl.fromTo(el("f3-chip"), { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.34, ease: "power3.out" }, 4.36);

      tl.to(el("f3-chip"), { opacity: 1, duration: 0.12, ease: "power1.out" }, 10.19);
