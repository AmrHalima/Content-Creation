        <svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
          <path id="f06-wire-a" class="f06-wire" d="M 540 620 L 540 748" />
          <polygon id="f06-head-a" class="f06-head" points="525,738 540,766 555,738" />
          <path id="f06-wire-b" class="f06-wire" d="M 540 1000 L 540 1092" />
          <polygon id="f06-head-b" class="f06-head" points="525,1082 540,1110 555,1082" />

      <div id="f06-sig-line" class="f06-sig"><span class="f06-sig-kw">function</span>&nbsp;toReceipt(raw: BankResponse):&nbsp;<span class="f06-sig-type">Receipt</span></div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var D = 8.085;
      var el = function (id) { return document.getElementById(id); };
      var tl = gsap.timeline({ paused: true });
      window.__timelines["06-the-return-morph"] = tl;

      // ── THE LABEL SWAP ──────────────────────────────────────────────────────────────
      // In-place text change, so it goes through a time proxy + reverse-search discrete
      // sequence. tl.set({ text: ... }) is a silent no-op here (no TextPlugin in the
      // shipped GSAP) and check still reports 0 errors, so this is the only sanctioned
      // shape. Snapshot at 2.4s must read Promise<BankResponse>; at 5.0s Promise<Receipt>.
      function textSeq(node, states) {
        var pr = { t: 0 };
        tl.to(pr, {
          t: states[states.length - 1].t,
          duration: states[states.length - 1].t,
          ease: "none",
          onUpdate: function () {
            for (var i = states.length - 1; i >= 0; i--) {
              if (pr.t >= states[i].t) {
                if (node.textContent !== states[i].text) node.textContent = states[i].text;
                return;
              }
            }
          }
        }, 0);
      }

      // ── ground ──
      tl.fromTo(el("f06-grid"), { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power1.out" }, 0);
      tl.fromTo(el("f06-spike"), { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 0.1);
      tl.fromTo(el("f06-ktext"), { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power1.out" }, 0.22);

      // ── Scene 1 (0.0–1.8s) "The answer gets converted too": the box pins, input chip seats ──
      tl.fromTo(el("f06-chip-in"), { opacity: 0, scale: 0.95 }, { opacity: 1, scale: 1, duration: 0.42, ease: "power3.out" }, 0.3);
      tl.fromTo(el("f06-tag-in"), { opacity: 0 }, { opacity: 1, duration: 0.36, ease: "power1.out" }, 0.62);
      tl.fromTo(el("f06-shell"), { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.46, ease: "power3.out" }, 1.02);

      // ── Scene 2 (1.8–4.4s) "back into a type you own": wire, the travelling dot, then the swap ──
      function draw(id, at, dur) {
        var p = el(id);
        var len = p.getTotalLength();
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
        tl.to(p, { strokeDashoffset: 0, duration: dur, ease: "power3.out" }, at);
      }
      draw("f06-wire-a", 1.9, 0.36);
      tl.fromTo(el("f06-head-a"), { opacity: 0 }, { opacity: 1, duration: 0.24, ease: "power1.out" }, 2.2);
      // the ember dot travels the wire into the box (this frame's single ember element)
      tl.fromTo(el("f06-dot"), { opacity: 0, attr: { cy: 624 } }, { opacity: 1, attr: { cy: 744 }, duration: 0.62, ease: "power2.in" }, 2.3);
      tl.to(el("f06-dot"), { opacity: 0, duration: 0.24, ease: "power1.in" }, 2.96);
      draw("f06-wire-b", 3.0, 0.36);
      tl.fromTo(el("f06-head-b"), { opacity: 0 }, { opacity: 1, duration: 0.24, ease: "power1.out" }, 3.3);

      // the output label arrives speaking the vendor's type, then converts
      tl.fromTo(el("f06-chip-out"), { opacity: 0, scale: 0.95 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 3.02);
      tl.fromTo(el("f06-tag-out"), { opacity: 0 }, { opacity: 1, duration: 0.34, ease: "power1.out" }, 3.2);
      textSeq(el("f06-chip-out"), [
        { t: 0, text: "Promise<BankResponse>" },
        { t: 3.5, text: "Promise<Receipt>" }
      ]);
      // and it takes the domain's colour at the same instant (lavender = your side only)
      tl.to(el("f06-chip-out"), { backgroundColor: "#f0d7ff", borderColor: "#1a1a1a", color: "#1a1a1a", duration: 0.34, ease: "power1.out" }, 3.5);

      // ── Scene 3 (4.4–6.4s) the declaration and the animation say the same thing ──
      tl.fromTo(el("f06-sig-line"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.46, ease: "power3.out" }, 4.5);

      // ── Scene 4 (6.4–8.09s) "Every difference handled in one box": the seal draws, then stillness ──
      var seal = el("f06-seal");
      var sealLen = seal.getTotalLength();
      seal.style.strokeDasharray = String(sealLen);
      seal.style.strokeDashoffset = String(sealLen);
      tl.to(seal, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 6.0);

      var jit = { p: 0 };
      var out = el("f06-chip-out");
      var HOLD = 7.3;
      gsap.set(out, { transformOrigin: "50% 50%" });
      tl.to(jit, {
        p: Math.PI * 2 * 0.2,
        duration: D - HOLD,
        ease: "none",
        onUpdate: function () {
          out.style.transform = "translateY(" + (Math.sin(jit.p) * 1.8).toFixed(3) + "px)";
        }
      }, HOLD);
    })();
  </script>
