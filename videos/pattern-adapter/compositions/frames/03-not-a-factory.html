  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      var tl = gsap.timeline({ paused: true });
      window.__timelines["03-not-a-factory"] = tl;

      // discrete-text-sequence: a {t, text} array read by a time proxy whose onUpdate
      // assigns textContent. There is NO TextPlugin in the shipped GSAP, so
      // tl.set({ text: ... }) would silently no-op while check still reports 0 errors.
      // Reverse search makes it correct under any scrub direction.
      function textSeq(node, states) {
        var pr = { t: 0 };
        tl.to(pr, {
          t: states[states.length - 1].t,
          duration: states[states.length - 1].t,
          ease: "none",
          onUpdate: function () {
            for (var i = states.length - 1; i >= 0; i--) {
              if (pr.t >= states[i].t) {
                if (node.textContent !== states[i].text) node.textContent = states[i].text;
                return;
              }
            }
          }
        }, 0);
      }

      // ── ground ──
      tl.fromTo(el("f03-grid"), { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power1.out" }, 0);

      // ── Scene 1 (0.0–1.0s) "A factory picks which thing to build": the pinned chamber seats ──
