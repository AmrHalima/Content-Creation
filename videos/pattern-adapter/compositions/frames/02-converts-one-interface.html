  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var D = 8;
      var el = function (id) { return document.getElementById(id); };
      var tl = gsap.timeline({ paused: true });
      window.__timelines["02-converts-one-interface"] = tl;

      // ── ground ──
      tl.fromTo(el("f02-grid"), { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power1.out" }, 0);

      // ── Scene 1 (0.0–1.2s) "An adapter lets them talk": eyebrow, then the line wipes up ──

      tl.fromTo(el("f02-tag-a"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 3.2);
      tl.fromTo(el("f02-tag-b"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 3.4);

      // ── Scene 3 (4.2–6.0s) "It converts one interface into another": the wire draws toward your side ──
      var wire = el("f02-draw");
      var len = wire.getTotalLength();
      wire.style.strokeDasharray = String(len);

      tl.fromTo(el("f02-head"), { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.34, ease: "power3.out", transformOrigin: "50% 50%" }, 5.72);

      var head = el("f02-head");

      tl.to(jit, {

        duration: D - HOLD,
        ease: "none",
        onUpdate: function () {
          head.style.transform = "translateX(" + (Math.sin(jit.p) * 2.4).toFixed(3) + "px)";
