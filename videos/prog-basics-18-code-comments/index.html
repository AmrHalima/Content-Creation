<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="33.6"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-address"
        class="scene"
        data-composition-id="01-address"
        data-composition-src="compositions/frames/01-address.html"
        data-start="0"
        data-duration="4.4"
        data-track-index="1"
      ></div>
      <audio
        id="el-01-address-voice"
        src="assets/voice/01.wav"
        data-start="0"
        data-duration="4.4"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-02-strike"
        class="scene"
        data-composition-id="02-strike"
        data-composition-src="compositions/frames/02-strike.html"
        data-start="4.4"
        data-duration="6"
        data-track-index="1"
      ></div>
      <audio
        id="el-02-strike-voice"
        src="assets/voice/02.wav"
        data-start="4.4"
        data-duration="6"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-03-rename"
        class="scene"
        data-composition-id="03-rename"
        data-composition-src="compositions/frames/03-rename.html"
        data-start="10.4"
        data-duration="6"
        data-track-index="1"
      ></div>
      <audio
        id="el-03-rename-voice"
        src="assets/voice/03.wav"
        data-start="10.4"
        data-duration="6"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-04-cutaway"
        class="scene"
        data-composition-id="04-cutaway"
        data-composition-src="compositions/frames/04-cutaway.html"
        data-start="16.4"
        data-duration="11.2"
        data-track-index="1"
      ></div>
      <audio
        id="el-04-cutaway-voice"
        src="assets/voice/04.wav"
        data-start="16.4"
        data-duration="11.2"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-05-ask"
        class="scene"
        data-composition-id="05-ask"
        data-composition-src="compositions/frames/05-ask.html"
        data-start="27.599999999999998"
        data-duration="6"
        data-track-index="1"
      ></div>
      <audio
        id="el-05-ask-voice"
        src="assets/voice/05.wav"
        data-start="27.599999999999998"
        data-duration="6"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- captions -->
      <div
        id="el-captions"
        data-track-kind="captions"
        class="scene"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="33.6"
        data-track-index="2"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
