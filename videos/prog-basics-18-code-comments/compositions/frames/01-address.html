  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var D = 4.4;
      var T0 = 0;                       // film offset of this frame, for the REC timecode only
      var el = function (id) { return document.getElementById(id); };
      var tl = gsap.timeline({ paused: true });
      window.__timelines["01-address"] = tl;

      /* ground: duration = D/4 with an odd repeat, so the four segments cover D exactly and land
         back on the from-value. The state at the last frame of this scene equals the first of the
         next, so the board never reloads on a cut. */
      tl.fromTo(el("g1-grid"), { y: 0 }, { y: 16, duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
      tl.fromTo(el("g1-ga"), { opacity: 0.55 }, { opacity: 1, duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
      tl.fromTo(el("g1-gb"), { opacity: 0.5 }, { opacity: 1, duration: 1.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);

      /* chrome arrives and HOLDS — this is one continuous shot. 8 half-blinks = 4.0s <= D, so the dot
         sits at opacity 1 on this scene's last frame and cannot pop across the cut. */
      tl.fromTo(el("c1-dot"), { opacity: 1 }, { opacity: 0.15, duration: 0.5, ease: "sine.inOut",
        repeat: 7, yoyo: true }, 0);

         frame renders blank (check -> craft.first_frame_empty). */

      tl.fromTo(el("f1-l3"), { opacity: 0, x: -70 }, { opacity: 1, x: 0, duration: 0.34, ease: "power3.out", immediateRender: false }, 0.88);
      tl.fromTo(el("f1-l4"), { opacity: 0, x: -70 }, { opacity: 1, x: 0, duration: 0.38, ease: "power3.out", immediateRender: false }, 1.82);

      tl.fromTo(el("f1-hl"), { scaleX: 0 }, { scaleX: 1, duration: 0.28, ease: "power2.out", immediateRender: false }, 1.00);
      tl.set(el("f1-ht"), { color: "#22201B" }, 1.30);

      tl.fromTo(el("f1-l1"), { y: 0 }, { y: -3, duration: 0.95, ease: "sine.inOut", repeat: 3, yoyo: true }, 0.6);

      tl.to(el("f1-content"), { y: -60, opacity: 0, duration: 0.3, ease: "power2.in" }, 4.08);
