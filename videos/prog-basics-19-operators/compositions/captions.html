<template id="captions-template" data-composition-id="captions" data-width="1080" data-height="1920">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>


<style data-brand-tokens>
      :root {
      --cap-band-top: 1600px;
      --cap-band-height: 320px;
      }
    </style>

<style>
  @font-face{font-family:"Space Grotesk";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/SpaceGrotesk-400.woff2") format("woff2");}
  @font-face{font-family:"Space Grotesk";font-weight:700;font-style:normal;font-display:block;src:url("assets/fonts/SpaceGrotesk-700.woff2") format("woff2");}

  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
    /* the campaign's lifted band, per frame.md v2 section 5: band 1024 -> 1344, floor empty */
    --cap-band-top: 1024px;
    --cap-band-height: 320px;
    --say: #FFD166;
    --say-ink: #22201B;
    --ink: #F4F1EA;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* absolutely stacked over the SAME band — exactly one group shown at a time */
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }
  .caption-pill {
    max-width: 88%;
    padding: 22px 44px 28px;
    background: rgba(21, 24, 29, 0.72);
    border: 2px solid rgba(255, 255, 255, 0.16);
    border-radius: 20px;
    box-shadow: 0 18px 40px -18px rgba(0, 0, 0, 0.70);
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.14em 0.26em;
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: clamp(38px, 4.26vw, 46px);
    line-height: 1.2;
    letter-spacing: 0;
    color: var(--ink);
  }
  .caption-word {
    display: inline-block;
    padding: 0.04em 0.10em 0.06em;
    color: rgba(244, 241, 234, 0.45);
    border-radius: 8px;
  }
  .caption-word.is-active {
    color: var(--say-ink);
    background: var(--say);
  }
  .caption-word.is-spoken {
    color: var(--ink);
    background: transparent;
  }
  /* dormant until a word-classer tags them (kept from the engine's vocab) */
  .caption-word.cap-num { color: rgba(244, 241, 234, 0.62); }
  .caption-word.cap-num.is-active { color: var(--say-ink); background: var(--say); }
  .caption-word.cap-cta { color: var(--say); background: transparent; }

  @media (max-aspect-ratio: 9/16) {
    .caption-pill { max-width: 92%; }
    .caption-line { font-size: clamp(36px, 4.26vw, 46px); }
  }
</style>

<div
  id="captions-root"
  data-composition-id="captions"
  data-timeline-locked
  data-start="0"
  data-duration="30.52"
  data-fps="30"
  data-width="1080"
  data-height="1920"
>
  <div class="caption-layer" aria-hidden="true">
    <div id="caption-stage" class="caption-stage"></div>
  </div>
</div>

<script>

","words":[{"id":"caption-word-7-0","text":"Logical","start":9.34,"end":9.84},{"id":"caption-word-7-1","text":"operators","start":9.84,"end":10.34},{"id":"caption-word-7-2","text":"combine","start":10.34,"end":10.84},{"id":"caption-word-7-3","text":"conditions:","start":10.84,"end":11.46}]},{"id":"caption-group-8","frame":2,"start":11.46,"end":12.4,"text":"and,","words":[{"id":"caption-word-8-0","text":"and,","start":11.46,"end":12.4}]},{"id":"caption-group-9","frame":2,"start":12.4,"end":12.84,"text":"or,","words":[{"id":"caption-word-9-0","text":"or,","start":12.4,"end":12.84}]},{"id":"caption-group-10","frame":2,"start":12.84,"end":13.3,"text":"not.","words":[{"id":"caption-word-10-0","text":"not.","start":12.84,"end":13.18}]},{"id":"caption-group-11","frame":3,"start":14.44,"end":15.2,"text":"And watch out:","words":[{"id":"caption-word-11-0","text":"And","start":14.44,"end":14.58},{"id":"caption-word-11-1","text":"watch","start":14.58,"end":14.8},{"id":"caption-word-11-2","text":"out:","start":14.8,"end":15.08}]},{"id":"caption-group-12","frame":3,"start":15.54,"end":15.94,"text":"a single","words":[{"id":"caption-word-12-0","text":"a","start":15.54,"end":15.68},{"id":"caption-word-12-1","text":"single","start":15.68,"end":15.94}]},{"id":"caption-group-13","frame":3,"start":15.94,"end":17.36,"text":"equals sign assigns,","words":[{"id":"caption-word-13-0","text":"equals","start":15.94,"end":16.3},{"id":"caption-word-13-1","text":"sign","start":16.3,"end":16.68},{"id":"caption-word-13-2","text":"assigns,","start":16.68,"end":17.36}]},{"id":"caption-group-14","frame":3,"start":17.36,"end":17.78,"text":"a double","words":[{"id":"caption-word-14-0","text":"a","start":17.36,"end":17.52},{"id":"caption-word-14-1","text":"double","start":17.52,"end":17.78}]},{"id":"caption-group-15","frame":3,"start":17.78,"end":18.68,"text":"equals compares.","words":[{"id":"caption-word-15-0","text":"equals","start":17.78,"end":18.18},{"id":"caption-word-15-1","text":"compares.","start":18.18,"end":18.56}]},{"id":"caption-group-16","frame":4,"start":20.05,"end":21.13,"text":"Seven floor divided","words":[{"id":"caption-word-16-0","text":"Seven","start":20.05,"end":20.37},{"id":"caption-word-16-1","text":"floor","start":20.37,"end":20.67},{"id":"caption-word-16-2","text":"divided","start":20.67,"end":21.13}]},{"id":"caption-group-17","frame":4,"start":21.13,"end":21.71,"text":"by two","words":[{"id":"caption-word-17-0","text":"by","start":21.13,"end":21.43},{"id":"caption-word-17-1","text":"two","start":21.43,"end":21.71}]},{"id":"caption-group-18","frame":4,"start":21.71,"end":22.39,"text":"gives three.","words":[{"id":"caption-word-18-0","text":"gives","start":21.71,"end":21.93},{"id":"caption-word-18-1","text":"three.","start":21.93,"end":22.27}]},{"id":"caption-group-19","frame":4,"start":22.73,"end":23.41,"text":"Seven over","words":[{"id":"caption-word-19-0","text":"Seven","start":22.73,"end":23.17},{"id":"caption-word-19-1","text":"over","start":23.17,"end":23.41}]},{"id":"caption-group-20","frame":4,"start":23.41,"end":24.01,"text":"two gives","words":[{"id":"caption-word-20-0","text":"two","start":23.41,"end":23.71},{"id":"caption-word-20-1","text":"gives","start":23.71,"end":24.01}]},{"id":"caption-group-21","frame":4,"start":24.01,"end":25.01,"text":"three point five.","words":[{"id":"caption-word-21-0","text":"three","start":24.01,"end":24.055},{"id":"caption-word-21-1","text":"point","start":24.01,"end":24.31},{"id":"caption-word-21-2","text":"five.","start":24.31,"end":24.89}]},{"id":"caption-group-22","frame":5,"start":26.19,"end":26.85,"text":"What's 7%","words":[{"id":"caption-word-22-0","text":"What's","start":26.19,"end":26.53},{"id":"caption-word-22-1","text":"7%","start":26.53,"end":26.73}]},{"id":"caption-group-23","frame":5,"start":26.99,"end":27.45,"text":"3?","words":[{"id":"caption-word-23-0","text":"3?","start":26.99,"end":27.33}]},{"id":"caption-group-24","frame":5,"start":27.71,"end":28.41,"text":"Comment it.","words":[{"id":"caption-word-24-0","text":"Comment","start":27.71,"end":28.03},{"id":"caption-word-24-1","text":"it.","start":28.03,"end":28.29}]}];
  var DURATION = 30.52;

  (function () {
    var stage = document.getElementById("caption-stage");

    GROUPS.forEach(function (group, g) {
      var groupEl = document.createElement("div");
      groupEl.className = "caption-group";
      groupEl.id = "caption-group-" + g;
      var pill = document.createElement("div");
      pill.className = "caption-pill";
      var line = document.createElement("div");
      line.className = "caption-line";
      (group.words || []).forEach(function (w, i) {
        var span = document.createElement("span");
        span.className = "caption-word";
        span.id = "caption-word-" + g + "-" + i;
        span.textContent = String(w.text);
        line.appendChild(span);
      });
      pill.appendChild(line);
      groupEl.appendChild(pill);
      stage.appendChild(groupEl);
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (group, g) {
      var groupEl = document.getElementById("caption-group-" + g);
      var words = group.words || [];
      var next = GROUPS[g + 1];
      var isLast = g === GROUPS.length - 1;
      var start = Math.max(0, Number(group.start));
      var end = isLast ? DURATION : Math.min(Number(next.start), Number(group.end) + 0.3);
      if (end <= start) end = start + 0.01;

      tl.set(groupEl, { opacity: 1 }, start);
      tl.set(groupEl, { opacity: 0 }, end);

      words.forEach(function (w, i) {
        var el = document.getElementById("caption-word-" + g + "-" + i);
        var at = Math.max(start, Number(w.start));
        tl.set(el, { className: "caption-word" }, start);
        tl.set(el, { className: "caption-word is-active" }, at);
        // micro-animation per word: it lifts onto the highlighter instead of just changing colour
        tl.fromTo(el, { scale: 0.94, y: 5 }, { scale: 1, y: 0, duration: 0.14, ease: "power2.out" }, at);
        if (i + 1 < words.length) {
          var nextAt = Math.max(start, Number(words[i + 1].start));
          tl.set(el, { className: "caption-word is-spoken" }, nextAt);
        }
      });
      if (words.length) {
        var lastEl = document.getElementById("caption-word-" + g + "-" + (words.length - 1));
        var lastSpoken = Math.min(end, Number(words[words.length - 1].end) + 0.1);
        tl.set(lastEl, { className: "caption-word is-spoken" }, lastSpoken);
      }
    });

    tl.to({}, { duration: DURATION }, 0);
    window.__timelines["captions"] = tl;
  })();
</script>
