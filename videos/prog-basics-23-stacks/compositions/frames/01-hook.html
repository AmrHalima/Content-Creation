<template>
  <style>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var D = 3.4;
      /* Measured word onsets, audio_meta.json frame 1 (studio cues, Kokoro af_heart @0.93):
         Press 0.00 / control 0.18 / Z 0.58 / and 0.90 / you're 1.40 / using 1.52 / a 1.74 / stack 1.88
         (audible to 2.08, then 1.32s of air). Every emphasis below cites one of these. */
      var C = { press: 0.00, control: 0.18, Z: 0.58, youre: 1.40, using: 1.52, a: 1.74,
                stack: 1.88, end: 2.08 };
      var el = function (id) { return document.getElementById(id); };
      var tl = gsap.timeline({ paused: true });
      window.__timelines["01-hook"] = tl;

      /* ground: every animation starts and ends at its own zero (4 passes of D/4) */
      tl.fromTo(el("g1-grid"), { y: 0 }, { y: 16, duration: D / 4, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
      tl.fromTo(el("g1-ga"), { opacity: 0.55 }, { opacity: 1, duration: D / 4, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
      tl.fromTo(el("g1-gb"), { opacity: 0.5 }, { opacity: 1, duration: D / 4, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);

      tl.fromTo(el("c1-ktext"), { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 0.1);
      tl.fromTo(el("c1-badge"), { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.26, ease: "back.out(1.7)", immediateRender: false }, 0.22);

      /* P1 say-sweep on the hook's sharpest group. No entrance tween on the first line beyond the

      tl.fromTo(el("f1-l1"), { opacity: 0, x: -90 }, { opacity: 1, x: 0, duration: 0.42, ease: "power3.out" }, 0.12);
      tl.fromTo(el("f1-l2"), { opacity: 0, x: -90 }, { opacity: 1, x: 0, duration: 0.42, ease: "power3.out", immediateRender: false }, C.youre - 0.12);
      tl.fromTo(el("f1-l3"), { opacity: 0, x: 90 }, { opacity: 1, x: 0, duration: 0.42, ease: "power3.out", immediateRender: false }, C.using - 0.30);

      /* the plate sweeps from the first word of its own group and completes on `a stack` (1.74-1.88) */
      tl.fromTo(el("f1-hl"), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, C.using + 0.02);
      tl.set(el("f1-tok"), { backgroundColor: "#FFD166" }, C.stack - 0.02);
      tl.set(el("f1-ht"), { color: "#22201B" }, C.stack - 0.02);
      tl.set(el("f1-hl"), { opacity: 0 }, C.stack - 0.02);
      tl.fromTo(el("f1-tok"), { boxShadow: "0 0 0 rgba(255,209,102,0)" },
