  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var D = 8.6;
      /* Measured word onsets, audio_meta.json frame 3 (studio cues):
         Undo 0.00 / history 0.38 / browser 1.20 / back 1.52 / button 1.84 / function 2.42 /
         calls 2.76 / all 3.18 / use 3.44 / stacks 3.64 / Push 4.64 / one 4.94 / push 5.58 /
         two 5.82 / then 6.32 / pop 6.44 / gives 6.70 / two 6.98 */
      var C = { undo: 0.00, back: 1.20, calls: 2.42, one: 4.94, two: 5.82,
                pushed: 6.30, pop: 6.44, gives: 6.70, tag: 6.98 };
      var el = function (id) { return document.getElementById(id); };
      var tl = gsap.timeline({ paused: true });
      window.__timelines["03-push-pop"] = tl;

      tl.fromTo(el("g3-grid"), { y: 0 }, { y: 16, duration: D / 4, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
      tl.fromTo(el("g3-ga"), { opacity: 0.55 }, { opacity: 1, duration: D / 4, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
      tl.fromTo(el("g3-gb"), { opacity: 0.5 }, { opacity: 1, duration: D / 4, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
      tl.fromTo(el("c3-ktext"), { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 0.1);

      /* entrance wipe: F2 came up, F3 comes from the RIGHT. The pile is already drawn inside the
         band, so the cut hands over the same object in the same place. */
      tl.fromTo(el("f3-content"), { x: 140, opacity: 0 }, { x: 0, opacity: 1, duration: 0.42, ease: "power3.out" }, 0.06);

      /* ── BEAT 1 (0.00-3.64): the three uses, P9 staggered, one chip per item, read flat ── */
      tl.fromTo(el("f3-c1"), { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.24, ease: "power2.out", immediateRender: false }, 0.24);
      tl.fromTo(el("f3-c2"), { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.24, ease: "power2.out", immediateRender: false }, C.back + 0.04);
      tl.fromTo(el("f3-c3"), { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.24, ease: "power2.out", immediateRender: false }, C.calls + 0.04);
      /* "all use stacks" 3.18-3.64: the row settles with one pulse-set (§ 9 P7), not a colour role */
      ["f3-c1", "f3-c2", "f3-c3"].forEach(function (id, i) {
        tl.fromTo(el(id), { scale: 1 }, { scale: 1.06, duration: 0.18, ease: "power2.out",
          yoyo: true, repeat: 1, immediateRender: false }, 3.20 + i * 0.10);
      });

      /* ── BEAT 2 (4.64-7.30): push one, push two, then pop gives two ──
         P2 drop-in from y -210 (bounce.out), the plate emerges from BEHIND the pile's mouth for
         exactly the 0.46s of its fall (pb-14's scoped z-index finding), the lid lifts y -12 and
         returns, and the plate below never moves. */
      function push(plate, tag, t) {
        tl.fromTo(el(plate), { zIndex: -1 }, { zIndex: -1, duration: 0.46, ease: "none",
          clearProps: "zIndex", immediateRender: false }, t);
        tl.fromTo(el(plate), { y: -210, opacity: 0 }, { y: 0, opacity: 1, duration: 0.46,
          ease: "bounce.out", immediateRender: false }, t);
        tl.fromTo(el(plate), { scaleY: 1 }, { scaleY: 0.96, duration: 0.1, ease: "power2.out",
          immediateRender: false }, t + 0.44);
        tl.to(el(plate), { scaleY: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, t + 0.54);
        tl.fromTo(el(tag), { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power1.out",
          immediateRender: false }, t + 0.5);
        /* the lid makes room, then seats back down */
        tl.to(el("f3-lid"), { y: -12, duration: 0.16, ease: "power2.out", immediateRender: false }, t + 0.34);
        tl.to(el("f3-lid"), { y: 0, duration: 0.22, ease: "power2.inOut", immediateRender: false }, t + 0.52);
      }
      /* the empty chamber is what the first plate lands into — it retires as the plate covers it */
      tl.to(el("f3-empty"), { opacity: 0, duration: 0.16, ease: "power1.in", immediateRender: false }, C.one + 0.28);
      push("f3-p1", "f3-t1", C.one);                      /* push ONE  4.94 */
      push("f3-p2", "f3-t2", C.two);                      /* push TWO  5.82 */

      tl.fromTo(el("f3-tagA"), { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.26,
        ease: "power2.out", immediateRender: false }, C.pushed);

      /* ── POP: the top plate exits x +260 y -150 opacity 0 (0.42s power3.out) WHILE the mint chip
         arrives in the slot the plate VACATED (left 420 / top 526 = centred in slot 516). Plate `1`
         at 608 carries no tween at all — that stillness is the part's claim. ── */
      tl.to(el("f3-lid"), { y: -12, duration: 0.16, ease: "power2.out", immediateRender: false }, C.pop);
      tl.to(el("f3-lid"), { y: 0, duration: 0.22, ease: "power2.inOut", immediateRender: false }, C.pop + 0.30);
      tl.to(el("f3-p2"), { x: 260, y: -150, opacity: 0, duration: 0.42, ease: "power3.out",
        immediateRender: false }, C.pop + 0.04);
      tl.to(el("f3-t2"), { opacity: 0, duration: 0.2, ease: "power1.in", immediateRender: false }, C.pop + 0.04);
      tl.fromTo(el("f3-chip"), { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.28,
        ease: "back.out(1.7)", immediateRender: false }, C.gives);
      tl.fromTo(el("f3-tagB"), { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.26,
        ease: "power2.out", immediateRender: false }, C.tag);

      /* the popped value holds to the cut — 1.6s of air with POP = 2 on screen */
      tl.fromTo(el("f3-chip"), { y: 0 }, { y: -4, duration: 1.0, ease: "sine.inOut", repeat: 1,
        yoyo: true, immediateRender: false }, C.gives + 0.5);

      tl.to(el("f3-content"), { y: -60, opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.32);

      tl.to({}, { duration: D }, 0);
    })();
  </script>
