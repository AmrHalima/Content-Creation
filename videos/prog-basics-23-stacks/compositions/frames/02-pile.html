  <style>

    /* ── G9 `pile` (frame-day3 § 6, part 23's new mark; every number below is § 6's, not mine) ──
       plate  : .pb-chamber geometry (G2: --panel #1F242C, 3px --line, radius 22, G2 shadow) at
                520x84, left 280, y 332 / 424 / 516 / 608 — pitch 92. The atom is G6's .f3-card h 84
                (pb-14 03-stack.html) with the staircase removed.
       lid    : 6px --line bar, left 260, width 560, y 320 — it IS the top, so it reads --line,
                never --say (amber is the word being said, and the lid is always true).
       TOP tag: mono --muted 1.85cqw at left 848, y 300 + a 12px CSS chevron straddling the lid edge.
                The tag and the chevron live at x 848+, outside the plate span 280-800, so they can
                never cover a digit.
       shelf  : 3px --line-faint, left 240, width 640, y 700. */
    .g9-plate { position: absolute; left: 280px; width: 520px; height: 84px; box-sizing: border-box;
      background: #1F242C; border: 3px solid rgba(255,255,255,0.16); border-radius: 22px; opacity: 0;
      box-shadow: 0 18px 40px -18px rgba(0,0,0,0.70); display: flex; align-items: center;
      justify-content: center; }
    .g9-s1 { top: 608px; }
    .g9-s2 { top: 516px; }
    .g9-s3 { top: 424px; }
    .g9-s4 { top: 332px; }
    /* G2's empty state: 3px DASHED --line, no value, and per § 6 no caret — nothing is waiting to be
       filled, that is the point (bible § 7.1: Day 3's danger beat is chrome, not colour). */
    .g9-empty { border-style: dashed; }
    .g9-val { display: inline-block; font-family: "Space Grotesk", sans-serif; font-weight: 700;

    .g9-tagl { left: 24px; right: auto; }
    .g9-lid { position: absolute; left: 260px; top: 320px; width: 560px; height: 6px;

      opacity: 0; }
    .g9-chev { position: absolute; left: 878px; top: 314px; width: 12px; height: 12px;
      box-sizing: border-box; opacity: 0; border-right: 3px solid rgba(255,255,255,0.16);

  <div id="root" data-composition-id="02-pile" data-width="1080" data-height="1920" data-duration="7.3">

      <div class="gnd-fill"></div>
      <div id="g2-grid" class="gnd-grid"></div>

        <div id="c2-ktext" class="pb-ktext" data-layout-ignore>PROGRAMMING&nbsp;BASICS&nbsp;·&nbsp;BASICS&nbsp;III&nbsp;·&nbsp;23</div>
      </div>
    </div>

    <div id="f2-content" class="clip clipband" data-start="0" data-duration="7.3" data-track-index="2">
      <div id="f2-shelf" class="g9-shelf"></div>
      <div id="f2-lid" class="g9-lid"></div>
      <div id="f2-top" class="g9-top" data-layout-ignore>top</div>

      <div id="f2-empty" class="g9-plate g9-s1 g9-empty"></div>

      <div id="f2-p1" class="g9-plate g9-s1"><span class="g9-tag f2-t1" id="f2-t1" data-layout-ignore>push</span></div>
      <div id="f2-p2" class="g9-plate g9-s2"><span class="g9-tag f2-t2" id="f2-t2" data-layout-ignore>push</span></div>
      <div id="f2-p3" class="g9-plate g9-s3"><span class="g9-tag f2-t3" id="f2-t3" data-layout-ignore>push</span><span class="g9-tag g9-tagl f2-t4" id="f2-t4" data-layout-ignore>pop</span></div>

    </div>
  </div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var D = 7.3;
      /* Measured word onsets, audio_meta.json frame 2 (studio cues, Kokoro af_heart @0.93):
         A 0.00 / stack 0.12 / last 0.62 / in 0.96 / first 1.50 / out 1.68 / like 2.28 / pile 2.52 /
         plates 2.96 / You 4.00 / push 4.10 / top 4.64 / and 4.94 / pop 5.16 / from 5.42 / top 5.76 */
      var C = { stack: 0.12, last: 0.62, like: 2.28, plates: 2.96, push: 4.10, pop: 5.16 };
      var el = function (id) { return document.getElementById(id); };
      var tl = gsap.timeline({ paused: true });
      window.__timelines["02-pile"] = tl;

      tl.fromTo(el("g2-grid"), { y: 0 }, { y: 16, duration: D / 4, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
      tl.fromTo(el("g2-ga"), { opacity: 0.55 }, { opacity: 1, duration: D / 4, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
      tl.fromTo(el("g2-gb"), { opacity: 0.5 }, { opacity: 1, duration: D / 4, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
      tl.fromTo(el("c2-ktext"), { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 0.1);

      /* entrance wipe: F1 wiped left, this one comes UP (§ 9 direction alternates) */
      tl.fromTo(el("f2-content"), { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42, ease: "power3.out" }, 0.08);

      /* ── "a stack" 0.12 — the container: shelf, lid, the TOP tag with its chevron straddling the
         lid's edge, and the empty dashed chamber on the bottom slot ── */
      tl.fromTo(el("f2-shelf"), { opacity: 0, scaleX: 0.6 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 0.16);
      tl.fromTo(el("f2-lid"), { opacity: 0, scaleX: 0.6 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 0.30);
      tl.fromTo(el("f2-top"), { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.26, ease: "power2.out", immediateRender: false }, 0.44);
      tl.fromTo(el("f2-chev"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out", immediateRender: false }, 0.54);
      tl.fromTo(el("f2-empty"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.32, ease: "power2.out", immediateRender: false }, 0.20);

      /* ── P2 drop-in, bottom plate first, one per clause (§ 6 motion contract) ──
         A plate pushed onto a pile emerges from behind what is already there, so the arriving plate
         is demoted for exactly the 0.46s of its fall and the property is cleared the frame it lands
         (pb-14's scoped-z-index finding: a permanent z-index re-rasterises the resting glyphs). */
      function drop(id, tag, t) {
        tl.fromTo(el(id), { zIndex: -1 }, { zIndex: -1, duration: 0.46, ease: "none",
          clearProps: "zIndex", immediateRender: false }, t);
        tl.fromTo(el(id), { y: -210, opacity: 0 }, { y: 0, opacity: 1, duration: 0.46,
          ease: "bounce.out", immediateRender: false }, t);
        tl.fromTo(el(id), { scaleY: 1 }, { scaleY: 0.96, duration: 0.1, ease: "power2.out",
          immediateRender: false }, t + 0.44);
        tl.to(el(id), { scaleY: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, t + 0.54);
        tl.fromTo(el(tag), { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power1.out",
          immediateRender: false }, t + 0.5);
      }
      /* the first plate replaces the empty chamber as it lands */
      tl.to(el("f2-empty"), { opacity: 0, duration: 0.16, ease: "power1.in", immediateRender: false }, C.last + 0.28);
      drop("f2-p1", "f2-t1", C.last);                    /* "last in, first out"  0.62 */
      drop("f2-p2", "f2-t2", C.like);                    /* "like a pile of"      2.28 */
      drop("f2-p3", "f2-t3", C.plates);                  /* "plates."             2.96 */

      /* ── one --say border flash per verb, on the TOP plate only, sequential — never two amber
         arrivals at once (§ 1, § 6 colour: the flash is 0.30s) ── */
      tl.to(el("f2-p3"), { borderColor: "#FFD166", duration: 0.12, ease: "power1.out", immediateRender: false }, C.push);
      tl.to(el("f2-p3"), { borderColor: "rgba(255,255,255,0.16)", duration: 0.18, ease: "power1.inOut", immediateRender: false }, C.push + 0.32);

      tl.fromTo(el("f2-t4"), { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power1.out", immediateRender: false }, C.pop);
      tl.to(el("f2-p3"), { borderColor: "#FFD166", duration: 0.12, ease: "power1.out", immediateRender: false }, C.pop + 0.06);
      tl.to(el("f2-p3"), { borderColor: "rgba(255,255,255,0.16)", duration: 0.18, ease: "power1.inOut", immediateRender: false }, C.pop + 0.38);

      /* ambient breath on the pile column, back to its own zero (lid + plates drift together) */
      tl.fromTo(el("f2-lid"), { y: 0 }, { y: -5, duration: D / 4, ease: "sine.inOut", repeat: 3, yoyo: true, immediateRender: false }, 1.4);

      tl.to(el("f2-content"), { y: -60, opacity: 0, duration: 0.3, ease: "power2.in" }, D - 0.32);

      tl.to({}, { duration: D }, 0);
    })();
  </script>
