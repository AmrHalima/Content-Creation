  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var D = 6.1;
      /* Measured word onsets, audio_meta.json frame 4 (studio cues):

         puts 2.28 / it 2.56 / on 2.74 / top 2.86 / Pop 3.56 / takes 3.82 / the 4.14 / top 4.34 /

      var C = { python: 0.14, list: 0.82, append: 1.96, it: 2.56, pop: 3.56, off: 4.56 };
      var el = function (id) { return document.getElementById(id); };
      var tl = gsap.timeline({ paused: true });
      window.__timelines["04-code"] = tl;

      tl.fromTo(el("g4-grid"), { y: 0 }, { y: 16, duration: D / 4, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
      tl.fromTo(el("g4-ga"), { opacity: 0.55 }, { opacity: 1, duration: D / 4, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
      tl.fromTo(el("g4-gb"), { opacity: 0.5 }, { opacity: 1, duration: D / 4, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);

      /* entrance wipe: F3 came from the right, F4 from the left */

      tl.fromTo(el("f4-lang"), { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.26, ease: "back.out(1.6)", immediateRender: false }, C.python + 0.34);

      /* P3 type-on: a chamber-coloured mask uncovers the line (right origin) while an amber caret
         runs the width. One line per spoken clause. */
      tl.set(el("f4-l1"), { opacity: 1 }, C.list - 0.04);
      tl.fromTo(el("f4-m1"), { scaleX: 1 }, { scaleX: 0, duration: 0.42, ease: "power1.inOut", immediateRender: false }, C.list - 0.04);
      tl.fromTo(el("f4-cr1"), { opacity: 1, x: 0 }, { opacity: 1, x: 130, duration: 0.42, ease: "power1.inOut", immediateRender: false }, C.list - 0.04);
      tl.set(el("f4-cr1"), { opacity: 0 }, C.list + 0.40);

      tl.set(el("f4-l2"), { opacity: 1 }, C.append + 0.02);
      tl.fromTo(el("f4-m2"), { scaleX: 1 }, { scaleX: 0, duration: 0.46, ease: "power1.inOut", immediateRender: false }, C.append + 0.02);
      tl.fromTo(el("f4-cr2"), { opacity: 1, x: 0 }, { opacity: 1, x: 470, duration: 0.46, ease: "power1.inOut", immediateRender: false }, C.append + 0.02);
      tl.set(el("f4-cr2"), { opacity: 0 }, C.append + 0.50);

      tl.set(el("f4-l3"), { opacity: 1 }, C.it + 0.02);
      tl.fromTo(el("f4-m3"), { scaleX: 1 }, { scaleX: 0, duration: 0.42, ease: "power1.inOut", immediateRender: false }, C.it + 0.02);
      tl.fromTo(el("f4-cr3"), { opacity: 1, x: 0 }, { opacity: 1, x: 470, duration: 0.42, ease: "power1.inOut", immediateRender: false }, C.it + 0.02);
      tl.set(el("f4-cr3"), { opacity: 0 }, C.it + 0.46);

      /* the first verb underlined as it is said, retired before the second arrival (§ 1, one at a time) */
      tl.fromTo(el("f4-u1"), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, C.append + 0.10);
      tl.to(el("f4-u1"), { scaleX: 0, duration: 0.22, ease: "power2.in", immediateRender: false }, C.pop - 0.24);

      tl.set(el("f4-l4"), { opacity: 1 }, C.pop + 0.02);
      tl.fromTo(el("f4-m4"), { scaleX: 1 }, { scaleX: 0, duration: 0.46, ease: "power1.inOut", immediateRender: false }, C.pop + 0.02);
      tl.fromTo(el("f4-cr4"), { opacity: 1, x: 0 }, { opacity: 1, x: 500, duration: 0.46, ease: "power1.inOut", immediateRender: false }, C.pop + 0.02);

      tl.fromTo(el("f4-o1"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.26, ease: "power2.out", immediateRender: false }, C.off - 0.10);
