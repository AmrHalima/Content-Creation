      /* the keyword inside the code lights last, on "builds on it", so the eye returns to the box */
      tl.to(el("f2-kw"), { color: "#FFD166", duration: 0.24, ease: "power1.out" }, 8.00);

      /* ambient float on the caller box, then the exit push inside the silence tail */
      tl.fromTo(el("f2-caller"), { y: 0 }, { y: 6, duration: 1.6, ease: "sine.inOut", repeat: 3, yoyo: true }, 4.80);
      tl.to(el("f2-content"), { y: -50, duration: 0.3, ease: "power2.in" }, D - 0.32);

      tl.to({}, { duration: D }, 0);
    })();
  </script>
