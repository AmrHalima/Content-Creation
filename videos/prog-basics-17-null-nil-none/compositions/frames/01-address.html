      var tl = gsap.timeline({ paused: true });

      /* ground: every animation returns to its own zero. duration = D/4 with repeat 3 (an odd

      tl.fromTo(el("f1-l3"), { opacity: 0, x: -70 }, { opacity: 1, x: 0, duration: 0.38, ease: "power3.out", immediateRender: false }, 1.00);

      /* the ink flip is a SET placed strictly after the plate finishes (1.72 + 0.30 = 2.02), not a
