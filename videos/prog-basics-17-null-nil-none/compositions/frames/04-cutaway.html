  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var D = 8.4;
      var T0 = 18.6;                    // film offset for the REC timecode only (STORYBOARD starts)
      var el = function (id) { return document.getElementById(id); };
      var tl = gsap.timeline({ paused: true });
      window.__timelines["04-cutaway"] = tl;

      /* ground: duration = D/4, odd segment count -> four segments cover 8.4s exactly, ends at zero */
      tl.fromTo(el("g4-grid"), { y: 0 }, { y: 16, duration: 2.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
      tl.fromTo(el("g4-ga"), { opacity: 0.55 }, { opacity: 1, duration: 2.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
      tl.fromTo(el("g4-gb"), { opacity: 0.5 }, { opacity: 1, duration: 2.1, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);

      /* REC dot: 15 half-blinks = 8.0s <= D; chrome never fades, and the dot is never coral */
      tl.fromTo(el("c4-dot"), { opacity: 1 }, { opacity: 0.15, duration: 0.5, ease: "sine.inOut",
        repeat: 15, yoyo: true }, 0);

      tl.to({ p: 0 }, { p: D, duration: D, ease: "none",
        onUpdate: function () {
          var s = Math.floor(T0 + this.targets()[0].p);
          el("c4-tctxt").textContent = "00:" + (s < 10 ? "0" + s : "" + s);
        } }, 0);

      /* the cutaway: a scrim and two chambers dropping into the SAME shot — chrome stays up.
         The drop is 40px, not pb-14's 90px, because this part stacks TWO 260px chambers and the

         titlebar chips measured ink at y 227, i.e. above § 5's content box. The travel is shorter
         so the chamber never carries ink above 230 while it is still legible. BRIEF deviation 11. */
      tl.fromTo(el("f4-scrim"), { opacity: 0 }, { opacity: 0.18, duration: 0.35, ease: "power1.out" }, 0.04);
      tl.fromTo(el("f4-cha"), { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.42,
        ease: "power3.out", immediateRender: false }, 0.08);
      tl.fromTo(el("f4-chb"), { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.42,
        ease: "power3.out", immediateRender: false }, 0.20);

      /* P3 type-on, one line per spoken clause. Cued: "Set user to None," 0.00-1.26 / "read user dot

         TypeError." 5.34-6.80. Chamber B's two lines are typed inside the same clause, before

      function typeon(lineId, revId, caretId, t, run, dur) {
        tl.set(el(lineId), { opacity: 1 }, t);
        tl.fromTo(el(revId), { clipPath: "inset(0 100% 0 0)" },

        tl.fromTo(el(caretId), { opacity: 1, x: 0 }, { opacity: 1, x: run, duration: dur,
          ease: "power1.inOut", immediateRender: false }, t);
        tl.to(el(caretId), { opacity: 0, duration: 0.18, ease: "power1.out" }, t + dur + 0.04);
      }
      typeon("f4-a1", "f4-ar1", "f4-ak1", 0.12, 192, 0.40);   // user = None
      typeon("f4-a2", "f4-ar2", "f4-ak2", 1.32, 158, 0.36);   // user.name
      typeon("f4-b1", "f4-br1", "f4-bk1", 2.10, 315, 0.48);   // const user = null;
      typeon("f4-b2", "f4-br2", "f4-bk2", 2.72, 175, 0.28);   // user.name;

      /* the two raised messages, one per error NAME (no say-sweep, no mint: they are errors, not

      tl.fromTo(el("f4-aerr"), { opacity: 0, x: -26 }, { opacity: 1, x: 0, duration: 0.36,

      tl.fromTo(el("f4-berr"), { opacity: 0, x: -26 }, { opacity: 1, x: 0, duration: 0.36,
        ease: "power3.out", immediateRender: false }, 6.42);

      tl.fromTo(el("f4-aerr"), { scale: 1 }, { scale: 1.012, duration: 0.2, ease: "power2.out",
        yoyo: true, repeat: 1, immediateRender: false }, 6.90);
      tl.fromTo(el("f4-berr"), { scale: 1 }, { scale: 1.012, duration: 0.2, ease: "power2.out",
        yoyo: true, repeat: 1, immediateRender: false }, 6.90);

      tl.fromTo(el("f4-cha"), { y: 0 }, { y: -4, duration: 1.9, ease: "sine.inOut", repeat: 3,
        yoyo: true, immediateRender: false }, 0.8);
      tl.fromTo(el("f4-chb"), { y: 0 }, { y: -3, duration: 1.9, ease: "sine.inOut", repeat: 3,
        yoyo: true, immediateRender: false }, 0.8);

      tl.to(el("f4-content"), { y: -60, opacity: 0, duration: 0.3, ease: "power2.in" }, 8.08);

      tl.to({}, { duration: D }, 0);
