<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="31.5"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-address"
        class="scene"
        data-composition-id="01-address"
        data-composition-src="compositions/frames/01-address.html"
        data-start="0"
        data-duration="4.3"
        data-track-index="1"
      ></div>
      <audio
        id="el-01-address-voice"
        src="assets/voice/01.wav"
        data-start="0"
        data-duration="4.3"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-02-names"
        class="scene"
        data-composition-id="02-names"
        data-composition-src="compositions/frames/02-names.html"
        data-start="4.3"
        data-duration="8.8"
        data-track-index="1"
      ></div>
      <audio
        id="el-02-names-voice"
        src="assets/voice/02.wav"
        data-start="4.3"
        data-duration="8.8"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-03-check"
        class="scene"
        data-composition-id="03-check"
        data-composition-src="compositions/frames/03-check.html"
        data-start="13.100000000000001"
        data-duration="5.5"
        data-track-index="1"
      ></div>
      <audio
        id="el-03-check-voice"
        src="assets/voice/03.wav"
        data-start="13.100000000000001"
        data-duration="5.5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-04-cutaway"
        class="scene"
        data-composition-id="04-cutaway"
        data-composition-src="compositions/frames/04-cutaway.html"
        data-start="18.6"
        data-duration="8.4"
        data-track-index="1"
      ></div>
      <audio
        id="el-04-cutaway-voice"
        src="assets/voice/04.wav"
        data-start="18.6"
        data-duration="8.4"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-05-save"
        class="scene"
        data-composition-id="05-save"
        data-composition-src="compositions/frames/05-save.html"
        data-start="27"
        data-duration="4.5"
        data-track-index="1"
      ></div>
      <audio
        id="el-05-save-voice"
        src="assets/voice/05.wav"
        data-start="27"
        data-duration="4.5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- captions -->
      <div
        id="el-captions"
        data-track-kind="captions"
        class="scene"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="31.5"
        data-track-index="2"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
