  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;

    --cap-band-top: 1024px;
    --cap-band-height: 320px;
    --say: #FFD166;
    --say-ink: #22201B;
    --ink: #F4F1EA;

  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* absolutely stacked over the SAME band — exactly one group shown at a time */
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }
  .caption-pill {
    max-width: 88%;

  .caption-line {

    flex-wrap: wrap;
    justify-content: center;
    gap: 0.14em 0.26em;
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: clamp(38px, 4.26vw, 46px);
    line-height: 1.2;
    letter-spacing: 0;
    color: var(--ink);
  }
  .caption-word {
    display: inline-block;
    padding: 0.04em 0.10em 0.06em;
    color: rgba(244, 241, 234, 0.45);
    border-radius: 8px;
  }
  .caption-word.is-active {
    color: var(--say-ink);
    background: var(--say);
  }
  .caption-word.is-spoken {
    color: var(--ink);
    background: transparent;
  }

  .caption-word.cap-num { color: rgba(244, 241, 234, 0.62); }
  .caption-word.cap-num.is-active { color: var(--say-ink); background: var(--say); }
  .caption-word.cap-cta { color: var(--say); background: transparent; }

  @media (max-aspect-ratio: 9/16) {
    .caption-pill { max-width: 92%; }
    .caption-line { font-size: clamp(36px, 4.26vw, 46px); }
  }
