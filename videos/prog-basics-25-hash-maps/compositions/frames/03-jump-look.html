  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var D = 11.5;
      var el = function (id) { return document.getElementById(id); };
      var tl = gsap.timeline({ paused: true });
      window.__timelines["03-jump-look"] = tl;

      tl.fromTo(el("g3-grid"), { y: 0 }, { y: 16, duration: 2.875, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
      tl.fromTo(el("g3-ga"), { opacity: 0.55 }, { opacity: 1, duration: 3.83, ease: "sine.inOut", repeat: 2, yoyo: true }, 0);
      tl.fromTo(el("g3-gb"), { opacity: 0.5 }, { opacity: 1, duration: 2.875, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
      tl.fromTo(el("c3-ktext"), { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" }, 0.1);
      tl.fromTo(el("c3-badge"), { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.26, ease: "back.out(1.7)", immediateRender: false }, 0.24);

      /* entrance wipe: F2 rose, this one comes in from the left — same board, no reload */
      tl.fromTo(el("f3-content"), { x: -140, opacity: 0 }, { x: 0, opacity: 1, duration: 0.42, ease: "power3.out" }, 0.1);
      tl.to(el("f3-content"), { x: 0, opacity: 1, duration: 0.01 }, 0.54);

      /* the board arrives as a set (it is the board F2 just built): row, index, key, rule */
      [0, 1, 2, 3, 4, 5].forEach(function (n, i) {
        tl.fromTo(el("f3-b" + n), { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 0.16 + i * 0.05);
        tl.fromTo(el("f3-i" + n), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.26, ease: "power2.out", immediateRender: false }, 0.34 + i * 0.05);
      });
      tl.fromTo(el("f3-hash"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 0.2);
      tl.fromTo(el("f3-tab"), { opacity: 0 }, { opacity: 1, duration: 0.26, ease: "power1.out", immediateRender: false }, 0.24);
      tl.fromTo(el("f3-fn"), { opacity: 0 }, { opacity: 1, duration: 0.26, ease: "power1.out", immediateRender: false }, 0.3);
      tl.fromTo(el("f3-chip"), { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 0.26);
      tl.fromTo(el("f3-slot"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 0.62);

      /* ── BEAT 1, the hop (lookup 0.14 / jumps 0.52 / straight 0.80 / answer 1.52) ───────
         one connector draws, the chip travels it in ONE run, slot 5 flashes --say for 0.30s.
         NO BUCKET MOVES — that stillness is what "constant time" means physically. */
      tl.fromTo(el("f3-hops"), { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.26, ease: "power3.out", immediateRender: false }, 0.54);
      tl.fromTo(el("f3-hopc"), { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, 0.74);
      /* the chip lands straddling bucket 5's BOTTOM edge (top 520): the piece file's Gate state says
         if the chip covers the value, move the chip's resting y — never the ring's. */
      tl.to(el("f3-chip"), { x: 395, y: 228, duration: 0.44, ease: "power3.out", immediateRender: false }, 0.56);
      tl.to(el("f3-b5"), { borderColor: "#FFD166", duration: 0.14, ease: "power1.out", immediateRender: false }, 1.0);
      tl.to(el("f3-b5"), { borderColor: "rgba(255,255,255,0.16)", duration: 0.3, ease: "power1.inOut", immediateRender: false }, 1.3);
      tl.fromTo(el("f3-tagA"), { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 1.3);
      tl.fromTo(el("f3-jn"), { scale: 1.22 }, { scale: 1, duration: 0.24, ease: "power3.out", immediateRender: false }, 1.4);

      /* ── BEAT 2, "constant time" (On 3.42 / constant 4.88 / time 5.30-5.68) ────────────
         nothing is animated: the board holds, the chip holds, the counter holds. Stillness is
         the beat. No notation is drawn or spoken (§ 7.2). */
      tl.fromTo(el("f3-chip"), { y: 228 }, { y: 224, duration: 0.9, ease: "sine.inOut", repeat: 1, yoyo: true, immediateRender: false }, 3.6);

      /* ── BEAT 3, "It reads one bucket." (It 6.26 / one 6.64 / bucket 6.92-7.20) ────────
         the counted pair's first half re-settles on the word that restates it. One amber arrival. */
      tl.to(el("f3-tagA"), { borderColor: "#FFD166", color: "#FFD166", duration: 0.26, ease: "power1.out", immediateRender: false }, 6.64);
      tl.to(el("f3-jn"), { color: "#FFD166", duration: 0.2, immediateRender: false }, 6.64);

      /* ── BEAT 4, the linear read (Reading 7.88 ... six 9.72-9.98) ──────────────────────
         the key is done being spoken about, so the chip retires before the ring walks — a ring
         stepping onto a parked chip would not be countable (the piece file's ring priority). */
      tl.to(el("f3-chip"), { opacity: 0, duration: 0.22, ease: "power2.in", immediateRender: false }, 7.6);
      tl.to(el("f3-tagA"), { borderColor: "rgba(255,255,255,0.16)", color: "#9BA6B2", duration: 0.3, ease: "power1.inOut", immediateRender: false }, 7.66);
      tl.fromTo(el("f3-ring"), { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(1.6)", immediateRender: false }, 7.78);
      tl.fromTo(el("f3-tagB"), { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 7.84);

      /* the six authored lefts, stepped in order; the counter is the whole argument, so it is
         paced to the spoken words (measured onsets) rather than to a 0.12s blur — § 6's stagger
         put six steps and the final 6 on screen 1.3s before the word "six". Recorded as a retime. */
      var steps = [7.88, 8.3, 8.64, 8.96, 9.3, 9.64];
      steps.forEach(function (t, i) {
        if (i > 0) {
          tl.to(el("f3-ring"), { x: 158 * i, duration: 0.3, ease: "power3.out", immediateRender: false }, t - 0.14);
        }
        tl.to(el("f3-ln"), { scale: 1.22, duration: 0.12, ease: "power2.out", immediateRender: false }, t);
        tl.to(el("f3-ln"), { scale: 1, duration: 0.16, ease: "power2.inOut", immediateRender: false }, t + 0.12);
      });

      /* LOOKED AT ticks 1..6 off a time proxy that assigns textContent — no TextPlugin, no wall clock */
      var lookSteps = [{ t: 7.88, v: "1" }, { t: 8.3, v: "2" }, { t: 8.64, v: "3" },
        { t: 8.96, v: "4" }, { t: 9.3, v: "5" }, { t: 9.64, v: "6" }];
      var clock = { t: 0 };
      function pick(arr, t) { var s = "1"; for (var i = 0; i < arr.length; i++) { if (t >= arr[i].t) s = arr[i].v; } return s; }
      tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: function () {
        var n = el("f3-ln");
        var s = pick(lookSteps, clock.t);
        if (n._v !== s) { n._v = s; n.textContent = s; }
      } }, 0);

      /* the ring stops at 6 because Sara was authored into the LAST slot — the honest worst case,
         and the only reason JUMPED 1 and LOOKED AT 6 are comparable numbers */
      tl.to(el("f3-b5"), { borderColor: "rgba(255,255,255,0.16)", duration: 0.01 }, 9.64);
      tl.fromTo(el("f3-ring"), { boxShadow: "0 0 0 8px rgba(255,209,102,0.10)" },
        { boxShadow: "0 0 0 16px rgba(255,209,102,0.20)", duration: 0.34, ease: "sine.inOut",
          yoyo: true, repeat: 1, immediateRender: false }, 9.72);

      tl.to(el("f3-content"), { y: -60, opacity: 0, duration: 0.3, ease: "power2.in" }, 11.18);

      tl.to({}, { duration: D }, 0);
    })();
  </script>
