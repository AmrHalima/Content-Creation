<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="33.5"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="4.8"
        data-track-index="1"
      ></div>
      <audio
        id="el-01-hook-voice"
        src="assets/voice/01.wav"
        data-start="0"
        data-duration="4.8"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-02-hash-board"
        class="scene"
        data-composition-id="02-hash-board"
        data-composition-src="compositions/frames/02-hash-board.html"
        data-start="4.8"
        data-duration="6.6"
        data-track-index="1"
      ></div>
      <audio
        id="el-02-hash-board-voice"
        src="assets/voice/02.wav"
        data-start="4.8"
        data-duration="6.6"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-03-jump-look"
        class="scene"
        data-composition-id="03-jump-look"
        data-composition-src="compositions/frames/03-jump-look.html"
        data-start="11.399999999999999"
        data-duration="11.5"
        data-track-index="1"
      ></div>
      <audio
        id="el-03-jump-look-voice"
        src="assets/voice/03.wav"
        data-start="11.399999999999999"
        data-duration="11.5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-04-code"
        class="scene"
        data-composition-id="04-code"
        data-composition-src="compositions/frames/04-code.html"
        data-start="22.9"
        data-duration="5.5"
        data-track-index="1"
      ></div>
      <audio
        id="el-04-code-voice"
        src="assets/voice/04.wav"
        data-start="22.9"
        data-duration="5.5"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-05-cta"
        class="scene"
        data-composition-id="05-cta"
        data-composition-src="compositions/frames/05-cta.html"
        data-start="28.4"
        data-duration="5.1"
        data-track-index="1"
      ></div>
      <audio
        id="el-05-cta-voice"
        src="assets/voice/05.wav"
        data-start="28.4"
        data-duration="5.1"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- captions -->
      <div
        id="el-captions"
        data-track-kind="captions"
        class="scene"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="33.5"
        data-track-index="2"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
