      :root {

<style>
  @font-face{font-family:"Space Grotesk";font-weight:400;font-style:normal;font-display:block;src:url("assets/fonts/SpaceGrotesk-400.woff2") format("woff2");}
  @font-face{font-family:"Space Grotesk";font-weight:700;font-style:normal;font-display:block;src:url("assets/fonts/SpaceGrotesk-700.woff2") format("woff2");}

  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
    /* the campaign's lifted band, per frame.md v2 section 5: band 1024 -> 1344, floor empty */
    --cap-band-top: 1024px;
    --cap-band-height: 320px;
    --say: #FFD166;
    --say-ink: #22201B;
    --ink: #F4F1EA;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* absolutely stacked over the SAME band — exactly one group shown at a time */
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }
  .caption-pill {
    max-width: 88%;
    padding: 22px 44px 28px;
    background: rgba(21, 24, 29, 0.72);
    border: 2px solid rgba(255, 255, 255, 0.16);
    border-radius: 20px;
    box-shadow: 0 18px 40px -18px rgba(0, 0, 0, 0.70);
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.14em 0.26em;
    font-family: "Space Grotesk", sans-serif;
    font-weight: 700;
    font-size: clamp(38px, 4.26vw, 46px);
    line-height: 1.2;
    letter-spacing: 0;
    color: var(--ink);
  }
  .caption-word {
    display: inline-block;
    padding: 0.04em 0.10em 0.06em;
    color: rgba(244, 241, 234, 0.45);
    border-radius: 8px;
  }
  .caption-word.is-active {
    color: var(--say-ink);
    background: var(--say);
  }
  .caption-word.is-spoken {
    color: var(--ink);
    background: transparent;
  }
  /* dormant until a word-classer tags them (kept from the engine's vocab) */
  .caption-word.cap-num { color: rgba(244, 241, 234, 0.62); }
  .caption-word.cap-num.is-active { color: var(--say-ink); background: var(--say); }
  .caption-word.cap-cta { color: var(--say); background: transparent; }

  @media (max-aspect-ratio: 9/16) {
    .caption-pill { max-width: 92%; }
    .caption-line { font-size: clamp(36px, 4.26vw, 46px); }
  }
</style>

    GROUPS.forEach(function (group, g) {

      groupEl.className = "caption-group";
      groupEl.id = "caption-group-" + g;
      var pill = document.createElement("div");
      pill.className = "caption-pill";
      var line = document.createElement("div");
      line.className = "caption-line";
      (group.words || []).forEach(function (w, i) {

        span.id = "caption-word-" + g + "-" + i;

      pill.appendChild(line);
      groupEl.appendChild(pill);
      stage.appendChild(groupEl);

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (group, g) {
      var groupEl = document.getElementById("caption-group-" + g);
      var words = group.words || [];
      var next = GROUPS[g + 1];
      var isLast = g === GROUPS.length - 1;
      var start = Math.max(0, Number(group.start));
      var end = isLast ? DURATION : Math.min(Number(next.start), Number(group.end) + 0.3);
      if (end <= start) end = start + 0.01;

      tl.set(groupEl, { opacity: 1 }, start);
      tl.set(groupEl, { opacity: 0 }, end);

      words.forEach(function (w, i) {
        var el = document.getElementById("caption-word-" + g + "-" + i);
        var at = Math.max(start, Number(w.start));
        tl.set(el, { className: "caption-word" }, start);
        tl.set(el, { className: "caption-word is-active" }, at);
        // micro-animation per word: it lifts onto the highlighter instead of just changing colour

          var nextAt = Math.max(start, Number(words[i + 1].start));
          tl.set(el, { className: "caption-word is-spoken" }, nextAt);
        }
      });
      if (words.length) {
        var lastEl = document.getElementById("caption-word-" + g + "-" + (words.length - 1));
