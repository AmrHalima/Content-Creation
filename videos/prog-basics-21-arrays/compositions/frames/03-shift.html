  <script>

      tl.to(el("f3-b3"), { borderColor: "#FFD166", duration: 0.14, ease: "power1.out", immediateRender: false }, 1.54);
      tl.to(el("f3-v3"), { color: "#FFD166", duration: 0.14, ease: "power1.out", immediateRender: false }, 1.56);

      tl.fromTo(el("f3-tagA"), { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 1.96);

      moved.forEach(function (n, i) {
        var at = 2.52 + i * 0.13;
        tl.to(el("f3-b" + n), { x: 158, duration: 0.34, ease: "power3.inOut", immediateRender: false }, at);
        tl.fromTo(el("f3-h" + n), { opacity: 0 }, { opacity: 1, duration: 0.24, ease: "power1.out", immediateRender: false }, at + 0.1);
        tl.fromTo(el("f3-t" + n), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, at + 0.12);

      tl.to(el("f3-b5"), { scaleY: 0.94, duration: 0.1, ease: "power2.in", immediateRender: false }, 4.12);
