    (function () {

      window.__timelines["05-the-fallback"] = tl;

      // ── Scene 1 (0.0–1.14s) — the spine is already composed and OPEN, so the refusal is the

      tl.fromTo(el(P + "grid"), { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power1.out" }, 0);

      // ── Scene 2 (1.14–3.06s) — "still has to answer": the pip is refused at the chamber edge
      //    (a hard cut, not a fade) and comes straight back up. The lower path stays dark:
      //    nothing reaches the dependency, and that is shown by an empty connector. ──
      tl.to(el(P + "pip1"), { opacity: 0, duration: 0.12, ease: "none" }, 1.02);
      tl.to(el(P + "block"), { opacity: 1, duration: 0.14, ease: "none" }, 1.04);

      tl.to(el(P + "pip2"), { opacity: 0, duration: 0.16, ease: "none" }, 1.9);
      tl.to(el(P + "con2"), { opacity: 0.2, duration: 0.4, ease: "power1.out" }, 1.2);
      tl.to(el(P + "h2"), { opacity: 0.2, duration: 0.4, ease: "power1.out" }, 1.2);

      // ── Scene 3 (3.06–5.42s) — the branch self-draws right out of the chamber and the lavender

      tl.fromTo(el(P + "a2"), { opacity: 0, x: 22 }, { opacity: 1, x: 0, duration: 0.46, ease: "power3.out" }, 8.7);
      var rt = el(P + "return");
