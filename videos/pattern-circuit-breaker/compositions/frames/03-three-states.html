  </style>

  <div id="root" data-composition-id="03-three-states" data-width="1080" data-height="1920" data-duration="21.151">

    <div id="03-three-states-fieldclip" class="clip" data-start="0" data-duration="21.151" data-track-index="0" style="position:absolute;inset:0;">
      <div class="f03-field"></div>

    <div id="03-three-states-spineclip" class="clip" data-start="0" data-duration="21.151" data-track-index="1" style="position:absolute;inset:0;">

        <path id="03-three-states-h1" class="f03-head" d="M 189 522 L 217 522 L 203 548 Z" />
        <path id="03-three-states-h2" class="f03-head" d="M 189 856 L 217 856 L 203 882 Z" />

      <div id="03-three-states-travel1" class="f03-travel"></div>

      <div id="03-three-states-caller" class="f03-chip f03-caller">caller</div>

      <div id="03-three-states-box" class="f03-box">

      <div id="03-three-states-row1" class="f03-row f03-r1">

      <div id="03-three-states-row3" class="f03-row f03-r3">
        <div class="f03-mark" id="03-three-states-m3"></div>
        <div class="f03-pair" id="03-three-states-pair3">half-open &rarr; closed</div>
        <div class="f03-cause" id="03-three-states-cause3">probe succeeded</div>
        <div class="f03-hair"></div>

      <div id="03-three-states-row4" class="f03-row f03-r4">
        <div class="f03-mark" id="03-three-states-m4"></div>
        <div class="f03-pair" id="03-three-states-pair4">half-open &rarr; open</div>
        <div class="f03-cause" id="03-three-states-cause4">probe failed</div>
      </div>

  </div>

  <script>
    (function () {
      var el = function (id) { return document.getElementById(id); };
      var P = "03-three-states-";
      var tl = gsap.timeline({ paused: true });
      window.__timelines["03-three-states"] = tl;

      // ── discrete-text-sequence (studio/known-traps.md #3): TextPlugin is NOT shipped, so the
      //    state readout is a sparse {t, text} array read by a time proxy with a reverse search.
      //    A `tl.to(el, { text: … })` here would pass `check` and never move on screen. ──
      function seq(node, states, total) {
        var pr = { t: 0 };
        tl.to(pr, {
          t: total,
          duration: total,
          ease: "none",
          onUpdate: function () {
            for (var i = states.length - 1; i >= 0; i--) {
              if (pr.t >= states[i].t) {
                if (node.textContent !== states[i].text) node.textContent = states[i].text;
                return;
              }
            }
          }
        }, 0);
      }

      var state = el(P + "state");

      // The five flips, each cued on the measured word that says it. The proxy runs to the end of
      // the frame so the last state holds under a seek.
      seq(state, [
        { t: 0.00, text: "CLOSED" },
        { t: 7.68, text: "OPEN" },
        { t: 12.86, text: "HALF-OPEN" },
        { t: 17.14, text: "CLOSED" },
        { t: 19.48, text: "OPEN" }
      ], 20.6);
      // Every flip gets a one-frame dip so it reads as a state change, not a text edit.
      [7.68, 12.86, 17.14, 19.48].forEach(function (t) {
        tl.to(state, { opacity: 0, duration: 0.07, ease: "none" }, t - 0.07);
        tl.to(state, { opacity: 1, duration: 0.13, ease: "power1.out" }, t);
      });

      // ── Scene 1 (0.0–0.86s) — the chamber is already pinned from F2's landing; the rail shows
      //    its four shells at a third strength so the shape of what is coming is visible. ──
      tl.fromTo(el(P + "grid"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0);
      tl.fromTo(el(P + "kicker"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.1);
      tl.fromTo([el(P + "caller"), el(P + "dep"), el(P + "box")], { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power3.out" }, 0.12);
      tl.fromTo([el(P + "con1"), el(P + "con2")], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.24);
      tl.fromTo([el(P + "h1"), el(P + "h2")], { opacity: 0 }, { opacity: 1, duration: 0.34, ease: "power1.out" }, 0.3);
      tl.fromTo(el(P + "rhead"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" }, 0.34);
      [1, 2, 3, 4].forEach(function (n) {
        tl.fromTo(el(P + "row" + n), { opacity: 0 }, { opacity: 0.34, duration: 0.44, ease: "power1.out" }, 0.42 + n * 0.06);
      });

      // ── Scene 2 (0.86–2.34s) — "calls flow": two calls travel the whole spine. ──
      function flow(node, at, span, dur) {
        tl.set(node, { y: 0 }, at);
        tl.fromTo(node, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.26, ease: "power3.out" }, at);
        tl.to(node, { y: span, duration: dur, ease: "power1.inOut" }, at + 0.18);
        tl.to(node, { opacity: 0, duration: 0.16, ease: "none" }, at + 0.18 + dur);
      }
      flow(el(P + "travel1"), 0.86, 452, 0.94);
      flow(el(P + "travel2"), 1.4, 452, 0.94);

      // ── Scene 3 (2.34–4.80s) — "counts failures": three pips fill, one per beat. ──
      tl.to(el(P + "flab"), { opacity: 1, duration: 0.32, ease: "power1.out" }, 2.4);
      [[P + "p1", 2.82], [P + "p2", 3.4], [P + "p3", 3.9]].forEach(function (p) {
        tl.to(el(p[0]), {
          backgroundColor: "#ffffeb",
          borderColor: "#1a1a1a",
          duration: 0.3,
          ease: "power2.out"
        }, p[1]);
      });

      // ── Scene 4 (4.80–8.20s) — the threshold bracket draws, the fourth pip lands past it,
      //    then the readout flips CLOSED → OPEN at 7.68 and row 1 steps up to full strength. ──
      var thr = el(P + "thr");
      var thrLen = thr.getTotalLength() * 1.05;
      thr.style.strokeDasharray = String(thrLen);
      thr.style.strokeDashoffset = String(thrLen);
      tl.to(thr, { strokeDashoffset: 0, duration: 0.52, ease: "power2.out" }, 4.86);
      tl.to(el(P + "tlab"), { opacity: 1, duration: 0.36, ease: "power1.out" }, 5.24);
      tl.to(el(P + "p4"), { backgroundColor: "#ffffeb", borderColor: "#1a1a1a", duration: 0.3, ease: "power2.out" }, 6.22);
      tl.to(el(P + "row1"), { opacity: 1, duration: 0.4, ease: "power1.out" }, 4.8);
      [ "pair1", "cause1" ].forEach(function (k) {
        tl.to(el(P + k), { color: "#1a1a1a", duration: 0.34, ease: "power1.out" }, 7.68);
      });
      tl.to(el(P + "m1"), { scaleY: 1, duration: 0.3, ease: "power2.out" }, 7.68);
      // the chamber's own edge steps up so the flip is legible from across the room
      tl.to(el(P + "box"), { borderColor: "#ffa946", duration: 0.28, ease: "power2.out" }, 7.68);

      // ── Scene 5 (8.76–10.60s) — "nothing leaves": a call is refused at the chamber edge and
      //    comes back up; the lower connector goes dark. Then a beat of still. ──
      tl.fromTo(el(P + "travel3"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.24, ease: "power3.out" }, 8.76);
      tl.to(el(P + "travel3"), { y: 96, duration: 0.34, ease: "power2.out" }, 9.0);
      tl.to(el(P + "travel3"), { y: 0, duration: 0.44, ease: "power2.inOut" }, 9.4);
      tl.to(el(P + "travel3"), { opacity: 0, duration: 0.18, ease: "none" }, 9.84);
      tl.to([el(P + "con2"), el(P + "h2")], { opacity: 0.18, duration: 0.44, ease: "power1.out" }, 8.9);

      // ── Scene 6 (10.60–13.22s) — the reset timer spends itself and the readout flips to
      //    HALF-OPEN at 12.86 exactly as the bar completes. ──
      tl.to(el(P + "rtlab"), { opacity: 1, duration: 0.32, ease: "power1.out" }, 10.6);
      tl.to(el(P + "rtrack"), { opacity: 1, duration: 0.32, ease: "power1.out" }, 10.7);
      tl.to(el(P + "rfill"), { scaleX: 1, duration: 2.02, ease: "power1.inOut" }, 10.84);
      tl.to(el(P + "row2"), { opacity: 1, duration: 0.4, ease: "power1.out" }, 10.6);
      tl.to([el(P + "pair2"), el(P + "cause2")], { color: "#1a1a1a", duration: 0.34, ease: "power1.out" }, 12.86);
      tl.to(el(P + "m2"), { scaleY: 1, duration: 0.3, ease: "power2.out" }, 12.86);

      // ── Scene 7 (13.66–16.44s) — exactly one probe leaves and reaches the dependency; the
      //    lower connector comes back up as it goes. ──
      tl.to([el(P + "con2"), el(P + "h2")], { opacity: 1, duration: 0.34, ease: "power1.out" }, 13.66);
      tl.fromTo(el(P + "travel3"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.26, ease: "power3.out" }, 14.36);
      tl.to(el(P + "travel3"), { y: 452, duration: 1.0, ease: "power1.inOut" }, 14.62);
      tl.to(el(P + "travel3"), { opacity: 0, duration: 0.18, ease: "none" }, 15.5);
      tl.to(el(P + "row3"), { opacity: 1, duration: 0.4, ease: "power1.out" }, 16.44);

      // ── Scene 8 (16.44–20.651s) — succeed → CLOSED at 17.14, fail → OPEN again at 19.48.
      //    The rail is complete; the last 1.1s holds so the diagram can be read. ──
      tl.to([el(P + "pair3"), el(P + "cause3")], { color: "#1a1a1a", duration: 0.34, ease: "power1.out" }, 17.14);
      tl.to(el(P + "m3"), { scaleY: 1, duration: 0.3, ease: "power2.out" }, 17.14);
      tl.to(el(P + "box"), { borderColor: "#ffffeb", duration: 0.3, ease: "power2.out" }, 17.14);
      // counting restarts under the closed state
      [P + "p1", P + "p2", P + "p3", P + "p4"].forEach(function (k, i) {
        tl.to(el(k), { backgroundColor: "rgba(26,26,26,0.06)", borderColor: "rgba(26,26,26,0.28)", duration: 0.26, ease: "power1.out" }, 17.6 + i * 0.1);
      });
      tl.to(el(P + "row4"), { opacity: 1, duration: 0.4, ease: "power1.out" }, 18.6);
      tl.to([el(P + "pair4"), el(P + "cause4")], { color: "#1a1a1a", duration: 0.34, ease: "power1.out" }, 19.48);
      tl.to(el(P + "m4"), { scaleY: 1, duration: 0.3, ease: "power2.out" }, 19.48);
      tl.to(el(P + "box"), { borderColor: "#ffa946", duration: 0.28, ease: "power2.out" }, 19.48);

      // ── a finite settle so the held read is alive without breathing (sine-wave-loop, low
      //    amplitude, one cycle over the hold — no repeat, no yoyo) ──
      var jit = { p: 0 };
      tl.to(jit, {
        p: Math.PI * 2,
        duration: 1.05,
        ease: "none",
        onUpdate: function () {
          el(P + "box").style.transform = "translateY(" + (1.4 * Math.sin(jit.p)).toFixed(2) + "px)";
        }
      }, 19.6);
    })();
  </script>
