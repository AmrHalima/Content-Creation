      // discrete-text-sequence via a time proxy + reverse search (there is NO TextPlugin here, so
      // tl.set({text}) would silently no-op): the domain chamber ends up carrying a table's name
      function textSeq(node, states) {
        var pr = { t: 0 };
        tl.to(pr, {
          t: states[states.length - 1].t,
          duration: states[states.length - 1].t,
          ease: "none",
          onUpdate: function () {
            for (var i = states.length - 1; i >= 0; i--) {
              if (pr.t >= states[i].t) {
                if (node.textContent !== states[i].text) node.textContent = states[i].text;
                return;
              }
            }
          }
        }, 0);
      }
      var sub = el("05-per-table-aggr-cls");
      textSeq(sub, [{ t: 0, text: "aggregate root" }, { t: 6.7, text: "orders table" }]);
      tl.to(sub, { opacity: 0, duration: 0.1, ease: "none" }, 6.6);
      tl.to(sub, { opacity: 1, duration: 0.26, ease: "power1.out" }, 6.7);

      // ── Scene 4 (7.58–11.883s) — the boundary draws and CANNOT close: 6% short on the left edge ──
      var b = el("05-per-table-boundary");
      var len = b.getTotalLength();
      b.style.strokeDasharray = String(len);
      b.style.strokeDashoffset = String(len);
