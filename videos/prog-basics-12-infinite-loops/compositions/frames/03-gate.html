      tl.fromTo(el("f3-gate"), { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.26, ease: "back.out(1.6)", immediateRender: false }, 1.46);
      tl.fromTo(el("f3-wire"), { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: "power3.out", immediateRender: false }, 1.58);
      tl.fromTo(el("f3-body"), { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 1.62);
      tl.fromTo(el("f3-bodylab"), { opacity: 0 }, { opacity: 1, duration: 0.24, immediateRender: false }, 1.72);
      tl.fromTo(el("f3-run"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(1.7)", immediateRender: false }, 1.76);

      tl.fromTo(el("f3-varlab"), { opacity: 0 }, { opacity: 1, duration: 0.26, immediateRender: false }, 1.98);

        tl.to(el("f3-run"), { x: 396, duration: dur * 0.58, ease: "power1.inOut", immediateRender: false }, t);

        tl.fromTo(el("f3-val"), { scale: 1 }, { scale: 1.14, duration: dur * 0.24, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, t + dur * 0.5);
        if (badge) {

      /* three settled passes, then the bounded accelerating spin (seven passes total, 0.42 -> 0.09).
         Nothing here is unbounded: the rail runs a fixed number of times and then the board freezes. */

      pass(2.50, 0.34, "f3-p2");
      pass(2.94, 0.26, "f3-p3");
