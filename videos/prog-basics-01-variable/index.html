<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="43.1"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="5.9"
        data-track-index="1"
      ></div>
      <audio
        id="el-01-hook-voice"
        src="assets/voice/01.wav"
        data-start="0"
        data-duration="5.9"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-02-labeled-box"
        class="scene"
        data-composition-id="02-labeled-box"
        data-composition-src="compositions/frames/02-labeled-box.html"
        data-start="5.9"
        data-duration="11.2"
        data-track-index="1"
      ></div>
      <audio
        id="el-02-labeled-box-voice"
        src="assets/voice/02.wav"
        data-start="5.9"
        data-duration="11.2"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-03-name-stays"
        class="scene"
        data-composition-id="03-name-stays"
        data-composition-src="compositions/frames/03-name-stays.html"
        data-start="17.1"
        data-duration="9"
        data-track-index="1"
      ></div>
      <audio
        id="el-03-name-stays-voice"
        src="assets/voice/03.wav"
        data-start="17.1"
        data-duration="9"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-04-example"
        class="scene"
        data-composition-id="04-example"
        data-composition-src="compositions/frames/04-example.html"
        data-start="26.1"
        data-duration="8.4"
        data-track-index="1"
      ></div>
      <audio
        id="el-04-example-voice"
        src="assets/voice/04.wav"
        data-start="26.1"
        data-duration="8.4"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-05-quiz"
        class="scene"
        data-composition-id="05-quiz"
        data-composition-src="compositions/frames/05-quiz.html"
        data-start="34.5"
        data-duration="8.6"
        data-track-index="1"
      ></div>
      <audio
        id="el-05-quiz-voice"
        src="assets/voice/05.wav"
        data-start="34.5"
        data-duration="8.6"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- captions -->
      <div
        id="el-captions"
        data-track-kind="captions"
        class="scene"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="43.1"
        data-track-index="2"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
