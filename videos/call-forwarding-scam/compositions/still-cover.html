<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      @font-face{font-family:"Noto Kufi Arabic";font-weight:100 900;font-style:normal;font-display:block;src:url("../assets/fonts/NotoKufiArabic-wght.ttf") format("truetype");}
      @font-face{font-family:"Noto Naskh Arabic";font-weight:100 900;font-style:normal;font-display:block;src:url("../assets/fonts/NotoNaskhArabic-wght.ttf") format("truetype");}
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #FFA946; }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        container-type: size;
        direction: rtl;
        background: #FFA946;
        font-family: "Noto Naskh Arabic", serif;
        color: #1A1A1A;
      }
      .sc-stub { position: absolute; top: 300px; right: 96px; width: 120px; height: 6px; background: #1A1A1A; }
      .sc-kicker {
        position: absolute; top: 360px; right: 96px; width: 888px;
        font-family: "Noto Kufi Arabic", sans-serif; font-size: 4cqw; font-weight: 500;
        letter-spacing: 0; color: rgba(26,26,26,0.66);
      }
      .sc-title {
        position: absolute; top: 470px; right: 96px; width: 888px;
        font-family: "Noto Kufi Arabic", sans-serif; font-size: 15cqw; font-weight: 900;
        line-height: 1.22; letter-spacing: 0; color: #1A1A1A;
      }
      .sc-tl { display: block; }
      .sc-lead {
        position: absolute; top: 1060px; right: 96px; width: 800px;
        font-family: "Noto Naskh Arabic", serif; font-size: 5.4cqw; font-weight: 400;
        line-height: 1.5; letter-spacing: 0; color: rgba(26,26,26,0.86);
      }
      .sc-rule { position: absolute; top: 1360px; right: 96px; width: 888px; height: 1px; background: rgba(26,26,26,0.4); }
      .sc-foot {
        position: absolute; top: 1420px; right: 96px; width: 888px;
        display: flex; flex-direction: column; gap: 22px;
      }
      .sc-foot b {
        font-family: "Noto Kufi Arabic", sans-serif; font-size: 5.6cqw; font-weight: 700;
        line-height: 1.3; letter-spacing: 0; color: #1A1A1A;
      }
      .sc-foot span {
        font-family: "Noto Naskh Arabic", serif; font-size: 4.2cqw; font-weight: 400;
        line-height: 1.5; letter-spacing: 0; color: rgba(26,26,26,0.72);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="1"
      data-fps="1"
      data-width="1080"
      data-height="1920"
      dir="rtl"
      lang="ar"
    >
      <div
        id="sc-clip"
        class="clip"
        data-start="0"
        data-duration="1"
        data-track-index="0"
        style="position:absolute;inset:0;"
      >
        <div class="sc-stub"></div>
        <div class="sc-kicker">تحذير</div>
        <div class="sc-title"><span class="sc-tl">تحويل</span><span class="sc-tl">المكالمات</span></div>
        <div class="sc-lead">النصب اللي مبيطلبش منك أي حاجة. مفيش كود اتسأل، ومفيش مكالمة بتترن عندها.</div>
        <div class="sc-rule"></div>
        <div class="sc-foot">
          <b>الفحص في دقيقتين</b>
          <span>اتعمله بإيدك إنت، على موبايل ماما وبابا.</span>
        </div>
      </div>
    </div>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
