    (function () {

      var el = function (id) { return document.getElementById(id); };

      window.__timelines["05-the-second-move"] = tl;

      tl.fromTo(el("f05-kicker"), { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 0.1);

      // each account locks as the reset runs through it

        var sh = el(id);
        tl.fromTo(sh, { y: -11 }, { y: 0, duration: 0.3, ease: "power3.in" }, 3.95 + i * 0.28);
        tl.to(sh, { stroke: "#FFA946", duration: 0.3 }, 3.95 + i * 0.28);
        tl.to(el("f05-acc" + (i + 1)), { borderColor: "rgba(255,169,70,0.55)", duration: 0.3 }, 3.95 + i * 0.28);

      // the system sends the code to the registered number...
      tl.fromTo(el("f05-devicesclip").querySelector("#f05-her"), { opacity: 0 }, { opacity: 1, duration: 0.4 }, 5.1);
      tl.fromTo(el("f05-chip"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 5.5);

      var route = el("f05-route");
      var RLEN = route.getTotalLength();
      route.style.strokeDasharray = String(RLEN);
      route.style.strokeDashoffset = String(RLEN);
      tl.to(route, { strokeDashoffset: 0, duration: 0.8, ease: "power1.inOut" }, 5.9);

      // ...and it travels to his phone
      var pip = el("f05-pip");
      var p = { v: 0 };

      tl.to(p, {
        v: 1, duration: 1.0, ease: "power1.inOut",
        onUpdate: function () {
          var pt = route.getPointAtLength(RLEN * p.v);
          pip.setAttribute("cx", pt.x);
          pip.setAttribute("cy", pt.y);
        }
      }, 6.5);

      // the card outline draws itself onto HIS phone, hers stays dark
      var card = el("f05-cardline");
      var LEN = card.getTotalLength();
      card.style.strokeDasharray = String(LEN);
      card.style.strokeDashoffset = String(LEN);
