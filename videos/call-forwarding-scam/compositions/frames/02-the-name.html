  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var el = function (id) { return document.getElementById(id); };
      var tl = gsap.timeline({ paused: true });
      window.__timelines["02-the-name"] = tl;

      tl.fromTo(el("f02-the-name-chromeclip").querySelector(".f02-label"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.15);

      // anchored-layout-expand: each half of the name grows from its own anchor, not a slide

      tl.fromTo(el("f02-the-name-gloss"), { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 2.6);

      // ── the flow: the call crosses your number and lands somewhere else ──

      tl.fromTo([el("f02-n1"), el("f02-box1")], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 4.4);

      // the strike: this number is where nothing happens
      var strike = el("f02-strike");
      var SLEN = strike.getTotalLength();

      strike.style.strokeDashoffset = String(SLEN);
      tl.to(strike, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 5.9);

      // the divert draws forward, then the call takes it
      var divert = el("f02-divert");
      var DLEN = divert.getTotalLength();
      divert.style.strokeDasharray = String(DLEN);
      divert.style.strokeDashoffset = String(DLEN);

      var pip = el("f02-pip");
      var RLEN = el("f02-route").getTotalLength();
      var pp = { v: 0 };
      tl.fromTo(pip, { opacity: 0 }, { opacity: 1, duration: 0.15 }, 6.6);
      tl.to(pp, {
        v: 1, duration: 1.1, ease: "power1.inOut",
        onUpdate: function () {
          var pt = el("f02-route").getPointAtLength(RLEN * pp.v);
          pip.setAttribute("cx", pt.x);
          pip.setAttribute("cy", pt.y);
        }
      }, 6.6);
      tl.to(pip, { opacity: 0, duration: 0.25 }, 7.5);
