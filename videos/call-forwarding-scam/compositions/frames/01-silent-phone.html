        <svg class="f01-svg" width="1080" height="410" viewBox="0 0 1080 410" xmlns="http://www.w3.org/2000/svg">

          <path id="f01-route" class="f01-wire" d="M 1010 60 L 290 60 C 268 60 250 78 250 100 L 250 165" />

          <!-- his phone, sitting under the wire, never touched -->
          <g id="f01-phone">

            <rect class="f01-dark" x="558" y="168" width="104" height="136" />

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var el = function (id) { return document.getElementById(id); };
      var tl = gsap.timeline({ paused: true });
      window.__timelines["01-silent-phone"] = tl;

      tl.fromTo(el("f01-silent-phone-grid"), { opacity: 0 }, { opacity: 0.55, duration: 1.1, ease: "power2.out" }, 0);

      tl.fromTo(el("f01-silent-phone-stub"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.18);
      tl.fromTo(el("f01-silent-phone-kickerclip").querySelector(".f01-warn"), { opacity: 0, x: 26 }, { opacity: 1, x: 0, duration: 0.42, ease: "power3.out" }, 0.42);

      var WORDS = el("f01-silent-phone-headclip").querySelectorAll(".f01-line1 .w");
      [0.95, 1.45, 1.85].forEach(function (t, i) {
        tl.fromTo(WORDS[i], { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.34, ease: "power4.out" }, t);
      });

      tl.fromTo(el("f01-silent-phone-hair"), { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 2.7);
      tl.fromTo(el("f01-silent-phone-line2"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 2.95);

      // ── the diagram: calls travel the wire and bend away; his phone never reacts ──
      tl.fromTo(el("f01-rail"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 3.2);

      var route = el("f01-route");
      var LEN = route.getTotalLength();
      route.style.strokeDasharray = String(LEN);
      route.style.strokeDashoffset = String(LEN);
      tl.to(route, { strokeDashoffset: 0, duration: 1.0, ease: "power1.inOut" }, 3.4);
      tl.fromTo(el("f01-arrow"), { opacity: 0 }, { opacity: 1, duration: 0.35 }, 3.4);
      tl.fromTo(el("f01-phone"), { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 4.0);
      tl.fromTo(el("f01-exit").querySelector("rect"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 4.2);

      // three calls pass. Finite by construction — no repeat.
      ["f01-p1", "f01-p2", "f01-p3"].forEach(function (id, i) {
        var dot = el(id);
        var at = 4.6 + i * 0.75;
        var p = { v: 0 };
        tl.fromTo(dot, { opacity: 0 }, { opacity: 1, duration: 0.18 }, at);
        tl.to(p, {
          v: 1, duration: 1.3, ease: "power1.inOut",
          onUpdate: function () {
            var pt = route.getPointAtLength(LEN * p.v);
            dot.setAttribute("cx", pt.x);
            dot.setAttribute("cy", pt.y);
          }
        }, at);
        tl.to(dot, { opacity: 0, duration: 0.22 }, at + 1.1);
      });

      // the first one goes straight past his phone
      tl.fromTo(el("f01-cross"), { opacity: 0 }, { opacity: 1, duration: 0.3 }, 5.15);
      // and lands on the other number
      tl.fromTo(el("f01-tag"), { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 5.85);
      // 7.2s -> 7.78s: held. The last call is already gone.
    })();
