  <style>

    /* the ligature guard is mandatory on every element that renders code (frame-day2 section 14):

    .cd-line { position: absolute; height: 58px; display: flex; align-items: center; opacity: 0;

    .cd-l-normal { left:30px; width:872px; }
    .cd-l-indent { left:105px; width:797px; }

    .f4-empty { position:absolute; left:105px; top:142px; width:430px; height:58px; box-sizing:border-box;

    .f4-hl { position:absolute; left:-6px; right:-8px; top:0.07em; bottom:0.05em; background:#FFD166;

    /* the part's second half, on screen: a base case alone is not enough, the step has to arrive at

    .f4-gloss { position:absolute; left:72px; top:810px; width:936px; height:40px; text-align:center;

      letter-spacing:0.06em; color:#9BA6B2; white-space:nowrap; }

        <div id="f4-m4" class="f4-lmask f4-m4"></div>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var D = 7.3;
      var el = function (id) { return document.getElementById(id); };
      var tl = gsap.timeline({ paused: true });
      window.__timelines["04-code"] = tl;

      tl.fromTo(el("g4-grid"), { y: 0 }, { y: 16, duration: 1.825, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
      tl.fromTo(el("g4-ga"), { opacity: 0.55 }, { opacity: 1, duration: 1.825, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
      tl.fromTo(el("g4-gb"), { opacity: 0.5 }, { opacity: 1, duration: 1.825, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);

      tl.fromTo(el("c4-badge"), { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.26,
        ease: "back.out(1.6)", immediateRender: false }, 0.24);

      tl.fromTo(el("f4-content"), { x: -140, opacity: 0 }, { x: 0, opacity: 1, duration: 0.42, ease: "power3.out" }, 0.06);
      tl.to(el("f4-content"), { x: 0, opacity: 1, duration: 0.01 }, 0.5);

      tl.fromTo(el("f4-chamber"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out", immediateRender: false }, 0.15);
      tl.fromTo(el("f4-file"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, 0.42);
      tl.fromTo(el("f4-lang"), { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.26, ease: "back.out(1.6)", immediateRender: false }, 0.56);

      /* ── P3 type-on, one line per measured clause of line 4.
         Every 0.00 / recursive 0.24 / function 0.82 / needs 1.12 / a 1.58 / base 1.70 / case 1.90 /
         and 2.20 / a 2.82 / step 2.92 / that 3.14 / moves 3.38 / toward 3.62 / it. 3.92 ── */
      tl.set(el("f4-l1"), { opacity: 1 }, 0.30);
      tl.fromTo(el("f4-m1"), { scaleX: 1 }, { scaleX: 0, duration: 0.72, ease: "power1.inOut", immediateRender: false }, 0.30);
      tl.fromTo(el("f4-cr1"), { opacity: 1, x: 0 }, { opacity: 1, x: 172, duration: 0.72, ease: "power1.inOut", immediateRender: false }, 0.30);
      tl.to(el("f4-cr1"), { opacity: 0, duration: 0.18, ease: "power1.in", immediateRender: false }, 1.06);

      /* the base case that is not there arrives on "needs a base case"; its border is a FLASH of

      tl.fromTo(el("f4-empty"), { opacity: 0, y: -26 }, { opacity: 1, y: 0, duration: 0.34,
        ease: "back.out(1.5)", immediateRender: false }, 1.30);
      tl.fromTo(el("f4-empty"), { borderColor: "rgba(255,255,255,0.16)" },
        { borderColor: "rgba(255,209,102,0.75)", duration: 0.22, ease: "power1.out", immediateRender: false }, 1.68);
      tl.to(el("f4-empty"), { borderColor: "rgba(255,255,255,0.16)", duration: 0.5, ease: "power1.inOut",

      /* the step is typed on across "and a step" */
      tl.set(el("f4-l3"), { opacity: 1 }, 2.30);
      tl.fromTo(el("f4-m3"), { scaleX: 1 }, { scaleX: 0, duration: 0.8, ease: "power1.inOut", immediateRender: false }, 2.30);
      tl.fromTo(el("f4-cr3"), { opacity: 1, x: 0 }, { opacity: 1, x: 302, duration: 0.8, ease: "power1.inOut", immediateRender: false }, 2.30);
      tl.to(el("f4-cr3"), { opacity: 0, duration: 0.18, ease: "power1.in", immediateRender: false }, 3.14);

      /* the frame's ONE say-plate, on the token the voice is naming: "a step that moves toward it" */
      tl.fromTo(el("f4-hl"), { scaleX: 0 }, { scaleX: 1, duration: 0.32, ease: "power2.out", immediateRender: false }, 3.22);
      tl.to(el("f4-ht"), { color: "#22201B", duration: 0.2, immediateRender: false }, 3.40);

      /* the call runs on "it." */
      tl.set(el("f4-l4"), { opacity: 1 }, 3.96);
      tl.fromTo(el("f4-m4"), { scaleX: 1 }, { scaleX: 0, duration: 0.34, ease: "power1.inOut", immediateRender: false }, 3.96);
      tl.fromTo(el("f4-cr4"), { opacity: 1, x: 0 }, { opacity: 1, x: 78, duration: 0.34, ease: "power1.inOut", immediateRender: false }, 3.96);
      tl.to(el("f4-cr4"), { opacity: 0, duration: 0.16, ease: "power1.in", immediateRender: false }, 4.32);

      /* the amber plate is retired BEFORE the coral strip arrives: one accent arrival per beat,
         and nothing holds two highlights at once */
      tl.to(el("f4-hl"), { scaleX: 0, duration: 0.24, ease: "power2.in", immediateRender: false }, 4.20);
      tl.to(el("f4-ht"), { color: "#F4F1EA", duration: 0.2, immediateRender: false }, 4.28);

      /* what the interpreter actually raised, in --err, not in the code colour. Retimed in this
         pass: the craft sampler measured this 5-word line's dwell at 1.40s against its 1.50s floor
         (2.00s recommended), so the strip now arrives at 4.50 (the plate is home by 4.48) and the
         5px float that used to "change" it at 5.60 is gone — the line sits still from the moment it

      tl.fromTo(el("f4-strip"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.36,
        ease: "power3.out", immediateRender: false }, 4.50);
      tl.fromTo(el("f4-tag"), { opacity: 0 }, { opacity: 1, duration: 0.26, ease: "power1.out",
        immediateRender: false }, 4.86);
      /* the second half of the rule, in the air after the VO: the voice said "a step that moves
         toward it" at 2.92-4.20, this lands once the strip has been read and holds ~1.1s to the cut */
      tl.fromTo(el("f4-gloss"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.36,
        ease: "power3.out", immediateRender: false }, 5.40);

      tl.to(el("f4-content"), { y: -60, opacity: 0, duration: 0.3, ease: "power2.in" }, 6.98);

      tl.to({}, { duration: D }, 0);
    })();
