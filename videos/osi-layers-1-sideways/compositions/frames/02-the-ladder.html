      var DRAW_START = 1.25;
      var DRAW_DUR = 2.45;
      var TRAVEL = 664; // 746 -> 1410, the full ladder
      var NDOT = 15;

          { opacity: 0, scale: 0.4 },
          { opacity: 1, scale: 1, duration: 0.12, ease: "power2.out" },
          DRAW_START + (i / NDOT) * DRAW_DUR

      }
      // arrowhead rides the same linear rate as the dots, so the two read as one crawl
      tl.fromTo(
        el("02-the-ladder-headwrap"),
        { y: 0 },
        { y: TRAVEL, duration: DRAW_DUR, ease: "none" },
        DRAW_START
