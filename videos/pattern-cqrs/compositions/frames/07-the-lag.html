  <script>
    (function () {
      var D = 9.293;
      var el = function (id) { return document.getElementById(id); };
      var P = "07-the-lag-";
      var tl = gsap.timeline({ paused: true });

      // the stale read flips in place — time proxy + reverse search, never a text tween
      var STATES = [{ t: 2.06, text: "new" }, { t: 5.10, text: "paid" }];
      var vread = el(P + "vread");
      vread.textContent = STATES[0].text;

      // ── Scene 1 (0.0–2.06s) — "One side reads what the other wrote" ──
      tl.fromTo(el(P + "grid"), { opacity: 0 }, { opacity: 1, duration: 0.7, ease: "power1.out" }, 0);
      tl.fromTo(el(P + "spike"), { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 0.1);
      tl.fromTo(el(P + "ktext"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0.2);
      tl.fromTo(el(P + "write"), { opacity: 0, y: -22 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 0.0);
      tl.fromTo(el(P + "headwrite"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0.4);
      tl.fromTo(el(P + "read"), { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 0.86);
      tl.fromTo(el(P + "headread"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 1.26);
      tl.fromTo(el(P + "vwrite"), { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 2.06);
      // the mismatch, stated before it is explained: the write is paid, the read still says new
      tl.fromTo(el(P + "vread"), { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 2.06);

      // ── Scene 2 (2.06–4.9s) — the arrow draws, then the marker travels while the read holds stale ──
      var path = el(P + "a1");
      var len = path.getTotalLength() * 1.05;
      path.style.strokeDasharray = String(len);
      path.style.strokeDashoffset = String(len);
      tl.to(path, { strokeDashoffset: 0, duration: 0.5, ease: "power3.out" }, 2.06);
      tl.fromTo(el(P + "k1"), { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power1.out" }, 2.46);
      tl.fromTo(el(P + "marker"), { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.24, ease: "power2.out" }, 3.22);
      tl.to(el(P + "marker"), { y: 216, duration: 1.65, ease: "power1.inOut" }, 3.30);

      // ── Scene 3 (4.9–7.16s) — "by a moment": the marker lands, the row catches up, the gap gets measured ──
      var proxy = { t: STATES[0].t };
      tl.to(proxy, {
        t: STATES[1].t,
        duration: STATES[1].t - STATES[0].t,
        ease: "none",
        onUpdate: function () {
          var k = STATES.length - 1;
          while (k > 0 && proxy.t < STATES[k].t) { k -= 1; }
          if (vread.textContent !== STATES[k].text) { vread.textContent = STATES[k].text; }
        }
      }, STATES[0].t);
      tl.fromTo(el(P + "gaprule"), { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.34, ease: "power2.out", transformOrigin: "center top" }, 6.30);
      tl.fromTo(el(P + "cap1"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 6.30);
      tl.fromTo(el(P + "cap2"), { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, 6.44);
      tl.fromTo(el(P + "gaplabel"), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 6.58);

      // ── Scene 4 (7.16–9.29s) — "is the price", then the quietest hold in the film ──
      tl.fromTo(el(P + "price"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.46, ease: "power3.out" }, 7.00);
      var jit = { p: 0 };
      var read = el(P + "read");
      tl.to(jit, {
        p: Math.PI * 2 * 0.3,
        duration: D - 7.8,
        ease: "none",
        onUpdate: function () {
          read.style.transform = "translateY(" + (Math.sin(jit.p) * 1.4).toFixed(3) + "px)";
        }
      }, 7.8);

      window.__timelines["07-the-lag"] = tl;
