    (function () {
      window.__timelines = window.__timelines || {};

      window.__timelines["06-agile"] = tl;

      // ── Seek-safe driver: the lockup token cycle (months → weeks) is text-state work —
      // discrete reverse-search + square-wave cursor blink, both pure functions of t. ──
      var figText = el("06-agile-figtext");
      var figCursor = el("06-agile-figcursor");
      var SEQ = [
        { t: 0.00, text: "months" },
        { t: 2.00, text: "month" },
        { t: 2.06, text: "mon" },
        { t: 2.12, text: "mo" },
        { t: 2.18, text: "m" },
        { t: 2.24, text: "" },
        { t: 2.28, text: "w" },
        { t: 2.34, text: "we" },
        { t: 2.40, text: "wee" },
        { t: 2.46, text: "week" },
        { t: 2.52, text: "weeks" }
      ];
      function textAt(time) {
        for (var i = SEQ.length - 1; i >= 0; i--) {
          if (time >= SEQ[i].t) return SEQ[i].text;
        }
        return "";
      }
      function cursorOpacity(t) {
        if (t < 1.95 || t >= 4.10) return 0;
        if (t < 2.60) return 1;                                   // solid while editing
        if (t < 3.80) {                                           // 2 whole blink cycles, 0.6s each
          var phase = ((t - 2.60) / 1.20) * Math.PI * 2 * 2;
          return Math.sin(phase) > 0 ? 1 : 0;
        }
        return (4.10 - t) / 0.30;                                 // fade out
      }
      var driver = { t: 0 };
      tl.to(driver, {
        t: D, duration: D, ease: "none",
        onUpdate: function () {
          figText.textContent = textAt(driver.t);
          figCursor.style.opacity = String(cursorOpacity(driver.t));
        }
      }, 0);

      // ── Scene 1: the column recoils into a sprint spiral; tiles ride to their slots ──
      tl.fromTo(el("06-agile-header"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.15);

      var coil = el("06-agile-coil");
      var coilLen = coil.getTotalLength() * 1.05;
      coil.style.strokeDasharray = String(coilLen);
      coil.style.strokeDashoffset = String(coilLen);
      tl.to(coil, { strokeDashoffset: 0, duration: 1.0, ease: "power2.out" }, 0.35);

      // sprint-boundary ticks at the coil crossings
      [1, 2, 3, 4, 5].forEach(function (n, i) {

      ];
