    (function () {

      var D = 12.331;

      window.__timelines["03-roll-call"] = tl;

      // ── one virtual camera over the oversized world (viewport-change: single source of truth).
      // Pure function of timeline time over a keyframe track — identical state on any seek,
      // forward or backward (no chained property tweens to revert out of order). ──
      var world = el("03-roll-call-world");
      var STOPS = [
        { t: 0.00,  x: 1530, y: 610,  s: 1.68 },
        { t: 0.20,  x: 1530, y: 610,  s: 1.68 },
        { t: 0.90,  x: 1530, y: 610,  s: 1.55 }, // arrival settle off the zoom-through
        { t: 2.55,  x: 1530, y: 610,  s: 1.55 }, // pans fire on the VO breaths
        { t: 3.30,  x: 2005, y: 1400, s: 1.55 },
        { t: 6.55,  x: 2005, y: 1400, s: 1.55 },
        { t: 7.30,  x: 1530, y: 2190, s: 1.55 },
        { t: 9.45,  x: 1530, y: 2190, s: 1.55 },
        { t: 10.15, x: 630,  y: 2180, s: 1.55 },
        { t: 11.65, x: 630,  y: 2180, s: 1.55 },
        { t: D,     x: 1215, y: 1420, s: 0.47 }  // finale ease-out: the whole loop, annotated
      ];
      function smooth(p) { return p * p * (3 - 2 * p); }
      function camAt(t) {
        if (t <= STOPS[0].t) return STOPS[0];
        for (var i = 0; i < STOPS.length - 1; i++) {
          var a = STOPS[i], b = STOPS[i + 1];
          if (t < b.t) {
            var p = smooth((t - a.t) / (b.t - a.t));
            return { x: a.x + (b.x - a.x) * p, y: a.y + (b.y - a.y) * p, s: a.s + (b.s - a.s) * p };
          }
        }
        return STOPS[STOPS.length - 1];
      }
      function renderCam(c) {
        world.style.transform =
          "translate(" + (540 - c.x * c.s) + "px, " + (960 - c.y * c.s) + "px) scale(" + c.s + ")";
      }

      // ── coral hands off station to station — one coral at a time; opacity is a pure
      // function of time over ordered non-overlapping windows per arc ──
      var CORAL = [
        { n: 1, wins: [{ t0: 0.25, t1: 0.55, v1: 1 }, { t0: 2.60, t1: 2.95, v1: 0 }, { t0: 11.70, t1: 12.05, v1: 1 }] },
        { n: 2, wins: [{ t0: 2.95, t1: 3.25, v1: 1 }, { t0: 6.60, t1: 6.95, v1: 0 }, { t0: 11.78, t1: 12.13, v1: 1 }] },
        { n: 3, wins: [{ t0: 7.00, t1: 7.30, v1: 1 }, { t0: 9.50, t1: 9.85, v1: 0 }, { t0: 11.86, t1: 12.21, v1: 1 }] },
        { n: 4, wins: [{ t0: 10.10, t1: 10.40, v1: 1 }] }
      ];
      function coralOp(wins, t) {
        var v = 0;
        for (var i = 0; i < wins.length; i++) {
          var w = wins[i];
          if (t >= w.t1) { v = w.v1; }
          else if (t >= w.t0) { return v + (w.v1 - v) * smooth((t - w.t0) / (w.t1 - w.t0)); }
          else { break; }
        }
        return v;
      }
      var coralEls = CORAL.map(function (c) {
        return { wins: c.wins, arc: el("03-roll-call-coral" + c.n), head: el("03-roll-call-coralhead" + c.n) };
      });

      var driver = { t: 0 };
      tl.to(driver, {
        t: D, duration: D, ease: "none",
        onUpdate: function () {
          renderCam(camAt(driver.t));
          coralEls.forEach(function (c) {
            var o = coralOp(c.wins, driver.t);
            c.arc.style.opacity = String(o);
            c.head.style.opacity = String(o);
          });
        }
      }, 0);

      // ── quote cards land on their spoken lines (smooth power3 settle, no spring) ──
      function pop(id, t) {
