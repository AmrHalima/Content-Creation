      var l1 = el("07-devops-l1text"), l2 = el("07-devops-l2text"), l3 = el("07-devops-l3text");

      var L1 = [{ t: 0.45, s: "b" }, { t: 0.52, s: "bu" }, { t: 0.59, s: "bui" }, { t: 0.66, s: "buil" }, { t: 0.73, s: "build" }];
      var L2 = [{ t: 0.90, s: "t" }, { t: 0.97, s: "te" }, { t: 1.04, s: "tes" }, { t: 1.11, s: "test" }];

      function seqAt(seq, t) {
        for (var i = seq.length - 1; i >= 0; i--) { if (t >= seq[i].t) return seq[i].s; }
        return "";
      }

      var STRIP = "deploy: routine \u00b7 rollback: first-class";
      var STRIP_T0 = 3.95, STRIP_CPS = 1 / 0.07;
      function stripAt(t) {
        if (t < STRIP_T0) return "";
        return STRIP.substring(0, Math.min(STRIP.length, Math.floor((t - STRIP_T0) * STRIP_CPS)));
      }

      var FIG = [
        { t: 0.00, s: "weeks" },
        { t: 2.50, s: "week" }, { t: 2.56, s: "wee" }, { t: 2.62, s: "we" }, { t: 2.68, s: "w" }, { t: 2.74, s: "" },
        { t: 2.86, s: "m" }, { t: 2.94, s: "mi" }, { t: 3.01, s: "min" }, { t: 3.09, s: "minu" },
        { t: 3.16, s: "minut" }, { t: 3.24, s: "minute" }, { t: 3.31, s: "minutes" }
      ];

      // caret envelope: solid while typing, N whole sin-blink cycles, linear fade
      function caretOp(t, solid0, solid1, blinkEnd, fadeEnd, cycles) {
        if (t < solid0 || t >= fadeEnd) return 0;
        if (t < solid1) return 1;
        if (t < blinkEnd) {
          var phase = ((t - solid1) / (blinkEnd - solid1)) * Math.PI * 2 * cycles;
          return Math.sin(phase) > 0 ? 1 : 0;
        }
        return (fadeEnd - t) / (fadeEnd - blinkEnd);
      }

      // dash flow: constant speed, then finite deceleration to a full stop at the gate
      var V0 = 60, FLOW_T0 = 1.90, JAM_T0 = 10.85, JAM_T1 = 11.65;
      function flowDisp(t) {
        if (t <= FLOW_T0) return 0;
        if (t < JAM_T0) return V0 * (t - FLOW_T0);
        var base = V0 * (JAM_T0 - FLOW_T0);
        if (t < JAM_T1) { var u = t - JAM_T0; return base + V0 * u - (V0 / (2 * (JAM_T1 - JAM_T0))) * u * u; }
        return base + V0 * (JAM_T1 - JAM_T0) / 2;
      }

      tl.to(driver, {
        t: D, duration: D, ease: "none",

          l3.textContent = seqAt(L3, t);
          l1c.style.opacity = String(caretOp(t, 0.42, 0.85, 0.85, 0.90, 1));

          l3c.style.opacity = String(caretOp(t, 1.26, 1.75, 2.95, 3.25, 2));

          figText.textContent = seqAt(FIG, t);
