  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var D = 8.661;
      var CORAL = "#CC785C";
      var INK = "#141413";
      var el = function (id) { return document.getElementById(id); };
      var tl = gsap.timeline({ paused: true });
      window.__timelines["01-the-diagram"] = tl;

      // ── ground ──
      tl.fromTo(el("01-the-diagram-grid"), { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power1.out" }, 0);

      // ── Scene 1: kicker types on (discrete word chunks) + context-sensitive caret ──
      tl.fromTo(el("01-the-diagram-spike"), { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 0.12);

      var KSEQ = [
        { t: 0.28, text: "THE " },
        { t: 0.46, text: "THE SOFTWARE " },
        { t: 0.64, text: "THE SOFTWARE DEVELOPMENT " },
        { t: 0.84, text: "THE SOFTWARE DEVELOPMENT LIFE " },
        { t: 1.02, text: "THE SOFTWARE DEVELOPMENT LIFE CYCLE" }
      ];
      function kTextAt(t) {
        for (var i = KSEQ.length - 1; i >= 0; i--) if (t >= KSEQ[i].t) return KSEQ[i].text;
        return "";
      }
      var ktextEl = el("01-the-diagram-ktext");
      var caretEl = el("01-the-diagram-caret");
      var driver = { t: 0 };
      var BLINK_CYCLES = 12; // whole number over D — period ~0.72s
      tl.to(driver, {
        t: D, duration: D, ease: "none",
        onUpdate: function () {
          var t = driver.t;
          ktextEl.textContent = kTextAt(t);
          // context-sensitive cursor: coral on the spike segment, ink on the main run
          caretEl.style.background = t < 0.28 ? CORAL : INK;
          if (t < 0.24) { caretEl.style.opacity = "0"; return; }
          var solid = t < 1.2; // no blink while typing
          var blinkOn = solid || Math.sin((2 * Math.PI * BLINK_CYCLES * t) / D) > 0;
          var fade = t < 5.6 ? 1 : Math.max(0, Math.min(1, (6.0 - t) / 0.4)); // caret retires as the strip lands
          caretEl.style.opacity = String((blinkOn ? 1 : 0) * fade);
        }
      }, 0);

      // ── Scene 2: six tiles land on their spoken words (waterfall-entry discipline) ──
      var TILES = [
        { id: "01-the-diagram-tile-plan",    t: 1.80, y: 70, dur: 0.19 },
        { id: "01-the-diagram-tile-design",  t: 2.10, y: 52, dur: 0.16 },
        { id: "01-the-diagram-tile-build",   t: 2.40, y: 50, dur: 0.15 },
        { id: "01-the-diagram-tile-test",    t: 2.70, y: 52, dur: 0.16 },
        { id: "01-the-diagram-tile-deploy",  t: 3.02, y: 50, dur: 0.15 },
        { id: "01-the-diagram-tile-operate", t: 3.34, y: 46, dur: 0.14 }
      ];
      TILES.forEach(function (spec) {
        var node = el(spec.id);
        tl.set(node, { opacity: 1 }, spec.t);
        tl.fromTo(node, { y: spec.y }, { y: 0, duration: spec.dur, ease: "power4.out" }, spec.t);
      });

      // ── mono arrow arcs self-draw between settled tiles (svg-path-draw) ──
      var ARCS = [
        { arc: "01-the-diagram-arc1", head: "01-the-diagram-head1", t: 2.22, dur: 0.34 },
        { arc: "01-the-diagram-arc2", head: "01-the-diagram-head2", t: 2.52, dur: 0.34 },
        { arc: "01-the-diagram-arc3", head: "01-the-diagram-head3", t: 2.82, dur: 0.34 },
        { arc: "01-the-diagram-arc4", head: "01-the-diagram-head4", t: 3.14, dur: 0.34 },
        { arc: "01-the-diagram-arc5", head: "01-the-diagram-head5", t: 3.46, dur: 0.34 },
        { arc: "01-the-diagram-arc6", head: "01-the-diagram-head6", t: 3.88, dur: 0.50 } // loop closes on "Fifty years old"
      ];
      ARCS.forEach(function (spec) {
        var p = el(spec.arc);
        var len = p.getTotalLength() * 1.05;
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
        tl.to(p, { strokeDashoffset: 0, duration: spec.dur, ease: "power2.out" }, spec.t);
        tl.set(el(spec.head), { opacity: 1 }, spec.t + spec.dur);
      });

      // ── Scene 3: index strip fades in under the ring, everything holds still ──
      tl.fromTo(el("01-the-diagram-strip"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 5.6);
