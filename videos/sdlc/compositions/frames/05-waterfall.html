      window.__timelines["05-waterfall"] = tl;

      // ── Seek-safe driver ──
      // Two motions touch a shared property more than once (ring opacity in+out, stamp scale

      // pure functions of t driven by one linear tween instead.
      var ring = el("05-waterfall-ring");
      var stamp = el("05-waterfall-stamp");

      function smooth(p) { return p * p * (3 - 2 * p); }

      function ringOpacity(t) {
        if (t < 0.08) return 0;
        if (t < 0.38) return smooth((t - 0.08) / 0.30);   // fade in
        if (t < 0.75) return 1;                            // hold
        if (t < 1.15) return 1 - smooth((t - 0.75) / 0.40); // morphs into the column
        return 0;
      }

      function stampScale(t) {
        if (t < 2.72) return 1.9;
        if (t < 2.84) { var p = (t - 2.72) / 0.12; return 1.9 - 0.98 * p * p; } // power1.in compression
        if (t < 3.34) {
          var q = (t - 2.84) / 0.50, m = q - 1;            // back.out(2.0) release
          return 0.92 + 0.08 * (1 + 3.0 * m * m * m + 2.0 * m * m);
        }
        return 1;
      }

      var driver = { t: 0 };
      tl.to(driver, {
        t: D, duration: D, ease: "none",
        onUpdate: function () {
          var t = driver.t;
          gsap.set(ring, { opacity: ringOpacity(t) });
          gsap.set(stamp, { opacity: t >= 2.72 ? 1 : 0, scale: stampScale(t), transformOrigin: "50% 50%" });
        }
      }, 0);

      // ── Scene 1: push-slide lands; the loop re-forms small at top, then unrolls into the gated column ──
      tl.fromTo(el("05-waterfall-header"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.15);

      var spine = el("05-waterfall-spine");
      var spineLen = spine.getTotalLength();
      spine.style.strokeDasharray = String(spineLen);
      spine.style.strokeDashoffset = String(spineLen);
      tl.to(spine, { strokeDashoffset: 0, duration: 0.65, ease: "power2.out" }, 0.35);

      // tiles reposition down the spine (transform-only flight from the ring center)

        { n: 1, t: 0.50, dy: -216 },
        { n: 2, t: 0.78, dy: -352 },
        { n: 3, t: 1.02, dy: -488 },
        { n: 4, t: 1.26, dy: -624 },
        { n: 5, t: 1.50, dy: -760 },
        { n: 6, t: 1.74, dy: -896 }
      ];

      // gate bars re-draw between settled tiles

      // ── Scene 2: the change-request form slides in beside the build→test gate; the coral stamp slams ──
